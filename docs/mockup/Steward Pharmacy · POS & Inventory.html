<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steward Pharmacy · POS & Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ============ Tokens (shadcn/ui zinc + Steward orange) ============ */
:root{
  --bg:#ffffff; --fg:#09090b; --sidebar:#fafafa; --sidebar-fg:#3f3f46;
  --card:#ffffff; --popover:#ffffff;
  --muted:#f4f4f5; --muted-fg:#71717a; --accent:#f4f4f5; --accent-fg:#18181b;
  --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa;
  --primary:#18181b; --primary-fg:#fafafa; --primary-hover:#27272a;
  --brand:#ea580c; --brand-hover:#c2410c; --brand-fg:#ffffff; --brand-soft:#fff7ed; --brand-soft-fg:#c2410c;
  --success:#16a34a; --success-soft:#f0fdf4; --success-fg:#15803d;
  --warning:#d97706; --warning-soft:#fffbeb; --warning-fg:#b45309;
  --danger:#dc2626; --danger-soft:#fef2f2; --danger-fg:#b91c1c;
  --info:#2563eb; --info-soft:#eff6ff; --info-fg:#1d4ed8;
  --chart-1:#ea580c; --chart-2:#a1a1aa; --chart-grid:#f4f4f5;
  --overlay:rgba(9,9,11,.45);
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px -1px rgba(0,0,0,.07);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.08);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --radius:10px;
  --font:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --fg:#fafafa; --sidebar:#0f0f11; --sidebar-fg:#a1a1aa;
    --card:#0c0c0e; --popover:#111113;
    --muted:#1c1c1f; --muted-fg:#a1a1aa; --accent:#1f1f23; --accent-fg:#fafafa;
    --border:#27272a; --input:#2e2e33; --ring:#52525b;
    --primary:#fafafa; --primary-fg:#18181b; --primary-hover:#e4e4e7;
    --brand:#f97316; --brand-hover:#fb923c; --brand-fg:#1c0a02; --brand-soft:rgba(249,115,22,.13); --brand-soft-fg:#fdba74;
    --success:#22c55e; --success-soft:rgba(34,197,94,.12); --success-fg:#4ade80;
    --warning:#f59e0b; --warning-soft:rgba(245,158,11,.12); --warning-fg:#fbbf24;
    --danger:#ef4444; --danger-soft:rgba(239,68,68,.12); --danger-fg:#f87171;
    --info:#3b82f6; --info-soft:rgba(59,130,246,.12); --info-fg:#60a5fa;
    --chart-1:#f97316; --chart-2:#52525b; --chart-grid:#1c1c1f;
    --overlay:rgba(0,0,0,.6);
    --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 10px 15px -3px rgba(0,0,0,.5); --shadow-xl:0 20px 25px -5px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa; --sidebar:#0f0f11; --sidebar-fg:#a1a1aa;
  --card:#0c0c0e; --popover:#111113;
  --muted:#1c1c1f; --muted-fg:#a1a1aa; --accent:#1f1f23; --accent-fg:#fafafa;
  --border:#27272a; --input:#2e2e33; --ring:#52525b;
  --primary:#fafafa; --primary-fg:#18181b; --primary-hover:#e4e4e7;
  --brand:#f97316; --brand-hover:#fb923c; --brand-fg:#1c0a02; --brand-soft:rgba(249,115,22,.13); --brand-soft-fg:#fdba74;
  --success:#22c55e; --success-soft:rgba(34,197,94,.12); --success-fg:#4ade80;
  --warning:#f59e0b; --warning-soft:rgba(245,158,11,.12); --warning-fg:#fbbf24;
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12); --danger-fg:#f87171;
  --info:#3b82f6; --info-soft:rgba(59,130,246,.12); --info-fg:#60a5fa;
  --chart-1:#f97316; --chart-2:#52525b; --chart-grid:#1c1c1f;
  --overlay:rgba(0,0,0,.6);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.5); --shadow-xl:0 20px 25px -5px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--sidebar);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
::selection{background:var(--brand-soft);color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.muted{color:var(--muted-fg)}
.icon{flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row{display:flex;align-items:center}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.grow{flex:1;min-width:0}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============ Button ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,box-shadow .15s;user-select:none}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-default{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow-xs)}
.btn-default:hover{background:var(--primary-hover)}
.btn-brand{background:var(--brand);color:var(--brand-fg);box-shadow:var(--shadow-xs)}
.btn-brand:hover{background:var(--brand-hover)}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn-outline:hover{background:var(--accent)}
.btn-secondary{background:var(--muted);color:var(--accent-fg)}
.btn-secondary:hover{background:var(--border)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--accent)}
.btn-destructive{background:var(--danger);color:#fff}
.btn-destructive:hover{filter:brightness(.92)}
.btn-danger-outline{background:var(--bg);border-color:var(--border);color:var(--danger-fg);box-shadow:var(--shadow-xs)}
.btn-danger-outline:hover{background:var(--danger-soft)}
.btn-link{background:none;padding:0;height:auto;color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.btn-link:hover{text-decoration-color:currentColor}
.btn-sm{height:32px;padding:0 10px;font-size:13px;gap:6px;border-radius:7px}
.btn-xs{height:26px;padding:0 8px;font-size:12px;gap:4px;border-radius:6px}
.btn-lg{height:44px;padding:0 20px;font-size:15px;border-radius:9px}
.btn-icon{width:36px;padding:0}
.btn-icon.btn-sm{width:32px}.btn-icon.btn-xs{width:26px}

/* ============ Form controls ============ */
.input,.select,.textarea{width:100%;height:36px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--bg);font-size:14px;box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s;outline:none}
.textarea{height:auto;min-height:76px;padding:8px 12px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--muted-fg)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.input:disabled,.select:disabled{opacity:.55;cursor:not-allowed}
.input-sm,.select-sm{height:32px;font-size:13px}
.select-wrap{position:relative;display:inline-flex;min-width:0}
.select-wrap .select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;white-space:nowrap;text-overflow:ellipsis}
.select-wrap .icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted-fg)}
.input-icon{position:relative;display:flex;align-items:center}
.input-icon>.icon{position:absolute;left:11px;color:var(--muted-fg);pointer-events:none}
.input-icon .input{padding-left:34px}
.input-icon .kbd{position:absolute;right:8px}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:0}
.field+.field{margin-top:14px}
.hint{font-size:12.5px;color:var(--muted-fg);margin-top:6px}
.error-text{font-size:12.5px;color:var(--danger-fg);margin-top:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .field+.field{margin-top:0}
.form-grid .span-2{grid-column:1/-1}

.kbd{display:inline-flex;align-items:center;gap:2px;height:20px;min-width:20px;padding:0 5px;border-radius:5px;border:1px solid var(--border);background:var(--muted);color:var(--muted-fg);font-family:var(--font);font-size:11px;font-weight:500;line-height:1}

.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--input);border:none;padding:0;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow-sm);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
:root[data-theme="dark"] .switch::after{background:#fafafa}
:root[data-theme="dark"] .switch[aria-checked="true"]::after{background:#18181b}

.checkbox{width:16px;height:16px;border-radius:4px;border:1px solid var(--input);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.checkbox[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}

/* ============ Badge ============ */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;line-height:1}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-outline{border-color:var(--border);color:var(--fg);background:var(--bg)}
.badge-secondary{background:var(--muted);color:var(--accent-fg)}
.badge-success{background:var(--success-soft);color:var(--success-fg)}
.badge-warning{background:var(--warning-soft);color:var(--warning-fg)}
.badge-danger{background:var(--danger-soft);color:var(--danger-fg)}
.badge-info{background:var(--info-soft);color:var(--info-fg)}
.badge-brand{background:var(--brand-soft);color:var(--brand-soft-fg)}
.badge-solid{background:var(--primary);color:var(--primary-fg)}
.count-pill{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:var(--brand-fg);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* ============ Card ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-xs);min-width:0}
.card-header{padding:18px 20px 0;display:flex;align-items:flex-start;gap:12px}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.card-desc{font-size:13px;color:var(--muted-fg);margin-top:2px}
.card-content{padding:16px 20px 20px}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}

/* ============ Tabs (segmented) ============ */
.tabs{display:inline-flex;align-items:center;height:36px;padding:3px;border-radius:9px;background:var(--muted);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:30px;padding:0 12px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:13px;font-weight:500;color:var(--muted-fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);box-shadow:var(--shadow-sm);border-color:var(--border)}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--input)}
.tab .tab-count{font-size:11px;color:var(--muted-fg);font-variant-numeric:tabular-nums}

.underline-tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--border);margin-bottom:24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.underline-tabs::-webkit-scrollbar{display:none}
.utab{position:relative;height:40px;padding:0 12px;background:none;border:none;font-size:14px;font-weight:500;color:var(--muted-fg);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.utab:hover{color:var(--fg)}
.utab[aria-selected="true"]{color:var(--fg)}
.utab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--fg)}

/* ============ Table ============ */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{height:40px;padding:0 12px;text-align:left;font-weight:500;color:var(--muted-fg);font-size:13px;white-space:nowrap;border-bottom:1px solid var(--border)}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:color-mix(in srgb,var(--muted) 60%,transparent)}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr:last-child td{border-bottom:none}
.table tr.selected{background:var(--muted)}
.table .r{text-align:right}
.table th:first-child,.table td:first-child{padding-left:20px}
.table th:last-child,.table td:last-child{padding-right:20px}
.table tfoot td{border-top:1px solid var(--border);border-bottom:none;background:var(--muted);font-weight:500}
.cell-main{font-weight:500}
.cell-sub{font-size:12.5px;color:var(--muted-fg)}
.expand-row td{background:var(--muted);padding:0!important}
.table-footer{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted-fg)}

.empty{padding:48px 20px;text-align:center;color:var(--muted-fg);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .empty-icon{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg);margin-bottom:6px;background:var(--bg);box-shadow:var(--shadow-xs)}
.empty .empty-title{color:var(--fg);font-weight:500;font-size:14px}
.empty p{margin:0;font-size:13px;max-width:320px}

/* ============ Shell ============ */
.shell{display:flex;height:100%;min-height:0}
.sidebar{width:256px;flex:none;display:flex;flex-direction:column;background:var(--sidebar);color:var(--sidebar-fg);transition:width .2s ease;height:100%;overflow:hidden}
.sidebar.collapsed{width:60px}
.sb-top{padding:8px}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px}
.sb-bottom{padding:8px;display:flex;flex-direction:column;gap:6px}
.sb-group{padding:8px 0}
.sb-label{height:32px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:500;color:var(--muted-fg);white-space:nowrap;transition:opacity .2s}
.collapsed .sb-label{opacity:0;height:8px}
.sb-item{width:100%;height:34px;display:flex;align-items:center;gap:10px;padding:0 9px;border:none;border-radius:8px;background:transparent;font-size:14px;color:var(--sidebar-fg);text-align:left;white-space:nowrap;transition:background .12s,color .12s;position:relative}
.sb-item:hover{background:var(--accent);color:var(--fg)}
.sb-item[aria-current="page"]{background:var(--accent);color:var(--fg);font-weight:500}
:root[data-theme="dark"] .sb-item[aria-current="page"]{background:#1f1f23}
.sb-item .icon{color:inherit}
.sb-item[aria-current="page"] .icon{color:var(--brand)}
.collapsed .sb-item .sb-text,.collapsed .sb-item .count-pill{display:none}
.collapsed .sb-item{justify-content:center;padding:0}
.collapsed .sb-item .count-dot{display:block}
.count-dot{display:none;position:absolute;top:6px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--sidebar)}
.sb-switcher{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;border:none;background:transparent;text-align:left}
.sb-switcher:hover{background:var(--accent)}
.sb-switcher:disabled{cursor:default}
.sb-switcher:disabled:hover{background:transparent}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.logo svg{position:relative}
.sb-meta{min-width:0;flex:1;line-height:1.25}
.sb-meta b{display:block;font-size:14px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.sb-meta span{display:block;font-size:12px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collapsed .sb-meta,.collapsed .sb-chev,.collapsed .sync-card{display:none}
.collapsed .sb-switcher,.collapsed .sb-user{justify-content:center;padding:6px 0}
.sb-user{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:none;background:transparent;border-radius:9px;text-align:left}
.sb-user:hover{background:var(--accent)}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--muted);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;border:1px solid var(--border)}
.sync-card{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:12px;box-shadow:var(--shadow-xs)}
.sync-card .row{gap:8px}
.sync-card b{font-size:13px;font-weight:600;color:var(--fg)}
.sync-card p{margin:6px 0 10px;font-size:12px;line-height:1.45;color:var(--muted-fg)}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none;position:relative}
.status-dot.online{background:var(--success)}
.status-dot.offline{background:var(--warning)}
.status-dot.online::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--success);opacity:.35}

.inset{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);margin:8px 8px 8px 0;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.topbar .vsep{width:1px;height:18px;background:var(--border);margin:0 4px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted-fg);min-width:0}
.crumbs b{font-weight:500;color:var(--fg)}
.crumbs .icon{opacity:.6}
.search-trigger{display:flex;align-items:center;gap:8px;height:34px;width:260px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--border);background:var(--muted);color:var(--muted-fg);font-size:13px;margin-left:auto}
.search-trigger:hover{background:var(--accent);color:var(--fg)}
.search-trigger .kbd{margin-left:auto;background:var(--bg)}
.sync-pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--shadow-xs)}
.sync-pill:hover{background:var(--accent)}
.sync-pill.offline{border-color:color-mix(in srgb,var(--warning) 45%,var(--border));background:var(--warning-soft);color:var(--warning-fg)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.page{padding:24px 28px 40px;max-width:1480px;margin:0 auto}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin:0}
.page-desc{margin:4px 0 0;font-size:14px;color:var(--muted-fg)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.offline-banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--warning-soft);color:var(--warning-fg);font-size:13px;border-bottom:1px solid color-mix(in srgb,var(--warning) 30%,var(--border))}
.offline-banner b{font-weight:600}

/* ============ Grid helpers ============ */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dash-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* KPI */
.kpi{padding:18px 20px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--muted-fg)}
.kpi-top .icon{color:var(--muted-fg)}
.kpi-value{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:10px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted-fg)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums}
.delta.up{color:var(--success-fg)}.delta.down{color:var(--danger-fg)}

/* Alerts strip */
.alert{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.alert .alert-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.alert-title{font-size:14px;font-weight:500}
.alert-desc{font-size:13px;color:var(--muted-fg);margin-top:1px}
.attention{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.attention .alert{align-items:center;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;width:100%}
.attention .alert:hover{border-color:var(--ring)}
.attention .alert .chev{margin-left:auto;color:var(--muted-fg)}

/* Chart */
.chart-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted-fg);align-items:center}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-box{position:relative;height:260px}
.chart-tip{position:absolute;pointer-events:none;background:var(--popover);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12px;min-width:150px;transform:translate(-50%,-100%);z-index:2;white-space:nowrap}
.chart-tip .t{font-weight:500;margin-bottom:6px}
.chart-tip .l{display:flex;align-items:center;gap:8px;color:var(--muted-fg)}
.chart-tip .l b{margin-left:auto;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.chart-tip .l i{width:8px;height:8px;border-radius:2px;display:inline-block}

.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0}
.bar-row+.bar-row{border-top:1px solid var(--border)}
.bar-track{grid-column:1/-1;height:6px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--brand)}

/* ============ POS ============ */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:0}
.pos-left{display:flex;flex-direction:column;min-height:0;min-width:0}
.pos-search{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.pos-search .input{height:44px;font-size:15px}
.pos-search .input-icon>.icon{left:14px}
.pos-search .input-icon .input{padding-left:40px;padding-right:130px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:12.5px;font-weight:500;color:var(--muted-fg);white-space:nowrap;transition:all .12s}
.chip:hover{color:var(--fg);border-color:var(--ring)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.pos-list{flex:1;overflow-y:auto;min-height:0}
.prod{display:grid;grid-template-columns:40px minmax(0,1fr) 110px 100px 36px;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none;text-align:left;transition:background .1s}
.prod:hover{background:var(--muted)}
.prod.top{background:color-mix(in srgb,var(--brand-soft) 70%,transparent)}
.prod:disabled{opacity:.5}
.prod-thumb{width:40px;height:40px;border-radius:9px;background:var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted-fg);border:1px solid var(--border)}
.prod-name{font-weight:500;font-size:14px}
.prod-sub{font-size:12.5px;color:var(--muted-fg)}
.prod-price{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.prod-add{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg)}
.prod:hover .prod-add{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.pos-listfoot{padding:10px 20px;font-size:12.5px;color:var(--muted-fg);border-top:1px solid var(--border);display:flex;gap:16px;align-items:center}

.cart{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.cart-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.cart-head h2{margin:0;font-size:15px;font-weight:600}
.cart-lines{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 20px;border-bottom:1px solid var(--border)}
.cline:last-child{border-bottom:none}
.cline-name{font-size:13.5px;font-weight:500;line-height:1.35}
.cline-sub{font-size:12px;color:var(--muted-fg)}
.cline .stepper{justify-self:start}
.cline-total{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;height:30px;overflow:hidden;background:var(--bg)}
.stepper button{width:28px;height:100%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted-fg)}
.stepper button:hover{background:var(--muted);color:var(--fg)}
.stepper input{width:40px;height:100%;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;font-size:13px;font-variant-numeric:tabular-nums;background:transparent;outline:none}
.cart-sum{border-top:1px solid var(--border);padding:14px 20px 16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.sum-line{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.sum-line b{color:var(--fg);font-weight:500}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:2px;border-top:1px dashed var(--border)}
.sum-total span{font-size:14px;font-weight:500}
.sum-total strong{font-size:32px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pay{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted-fg)}
.pay:hover{color:var(--fg)}
.pay[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.charge{height:52px;border-radius:10px;font-size:16px;font-weight:600;width:100%;justify-content:space-between;padding:0 18px}
.charge .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:inherit}

/* ============ Dialog / Sheet / Popover ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;animation:fade .15s ease;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
@keyframes slidein{from{transform:translateX(100%)}}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--popover);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);animation:pop .16s ease}
.dialog-head{padding:22px 24px 0;position:relative}
.dialog-title{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0}
.dialog-desc{font-size:14px;color:var(--muted-fg);margin:4px 0 0}
.dialog-body{padding:18px 24px}
.dialog-foot{padding:0 24px 22px;display:flex;justify-content:flex-end;gap:8px}
.dialog-close{position:absolute;top:14px;right:14px}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(560px,100vw);background:var(--popover);border-left:1px solid var(--border);box-shadow:var(--shadow-xl);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.32,.72,0,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);position:relative}
.sheet-body{flex:1;overflow-y:auto;padding:20px 24px}
.sheet-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg)}

.menu{position:absolute;z-index:70;min-width:220px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;animation:drop .12s ease}
.menu-label{padding:6px 8px;font-size:12px;font-weight:500;color:var(--muted-fg)}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;border:none;background:transparent;font-size:13.5px;text-align:left;color:var(--fg)}
.menu-item:hover,.menu-item[data-active="true"]{background:var(--accent)}
.menu-item .check{margin-left:auto}
.menu-sep{height:1px;background:var(--border);margin:4px -4px}
.menu-item .kbd{margin-left:auto}

/* Command palette */
.cmd{position:fixed;left:50%;top:14vh;transform:translateX(-50%);z-index:51;width:min(620px,calc(100vw - 24px));background:var(--popover);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);overflow:hidden;animation:drop .14s ease}
.cmd-input{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.cmd-input input{flex:1;height:52px;border:none;outline:none;background:transparent;font-size:15px}
.cmd-list{max-height:min(420px,56vh);overflow-y:auto;padding:6px}
.cmd-group{padding:8px 10px 4px;font-size:12px;font-weight:500;color:var(--muted-fg)}
.cmd-item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;border:none;background:transparent;text-align:left;font-size:14px}
.cmd-item[data-active="true"]{background:var(--accent)}
.cmd-item .icon{color:var(--muted-fg)}
.cmd-item .right{margin-left:auto;font-size:12.5px;color:var(--muted-fg);display:flex;gap:8px;align-items:center}
.cmd-foot{display:flex;gap:16px;padding:10px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg);background:var(--muted)}
.cmd-foot span{display:inline-flex;gap:6px;align-items:center}

/* Toasts */
.toasts{position:fixed;right:20px;top:calc(68px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:var(--popover);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:toastin .22s cubic-bezier(.32,.72,0,1)}
@keyframes toastin{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.toast .t-title{font-weight:500}
.toast .t-desc{color:var(--muted-fg);font-size:13px;margin-top:1px}
.toast .icon.success{color:var(--success)}.toast .icon.error{color:var(--danger)}.toast .icon.info{color:var(--info)}.toast .icon.warning{color:var(--warning)}
.toast button{margin-left:auto;background:none;border:none;color:var(--muted-fg);padding:2px;border-radius:4px}

/* Receipt */
.receipt-wrap{background:var(--muted);padding:20px;display:flex;justify-content:center;margin-bottom:18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.receipt{width:100%;max-width:340px;background:#fff;color:#18181b;font-family:var(--mono);font-size:12px;line-height:1.55;padding:22px 20px 26px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px -8px rgba(0,0,0,.18);--zz:8px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--zz)) 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--zz)) 100%}
.receipt .c{text-align:center}
.receipt .hr{border-top:1px dashed #a1a1aa;margin:10px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .ln span:last-child{white-space:nowrap}
.receipt .big{font-size:15px;font-weight:600}
.receipt .store{font-family:var(--font);font-size:15px;font-weight:600;letter-spacing:-.01em}
.receipt .muted-r{color:#71717a}
.success-ring{width:44px;height:44px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg)}
.login-form{display:flex;flex-direction:column;padding:32px 40px}
.login-inner{margin:auto;width:100%;max-width:360px}
.login-art{position:relative;overflow:hidden;background:#18181b;color:#fafafa;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;border-left:1px solid var(--border)}
.login-art .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.login-art .glow{position:absolute;width:520px;height:520px;right:-140px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.55),rgba(249,115,22,0) 65%)}
.demo-acct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);text-align:left;transition:border-color .15s,background .15s}
.demo-acct:hover{border-color:var(--ring);background:var(--muted)}
.divider-text{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted-fg);margin:22px 0 14px}
.divider-text::before,.divider-text::after{content:"";flex:1;height:1px;background:var(--border)}
.mini-branches{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;max-width:460px}
.mini-branch{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:10px;padding:12px 14px;backdrop-filter:blur(4px)}
.mini-branch b{display:block;font-size:13px;font-weight:500}
.mini-branch span{font-size:12px;color:#a1a1aa;display:flex;align-items:center;gap:6px;margin-top:2px}

/* Settings */
.settings-row{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--border)}
.settings-row:first-child{padding-top:0}
.settings-row h3{margin:0;font-size:14px;font-weight:600}
.settings-row p{margin:4px 0 0;font-size:13px;color:var(--muted-fg)}
.disc-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.disc-card+.disc-card{margin-top:8px}
.disc-icon{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand-soft-fg);display:flex;align-items:center;justify-content:center;flex:none}

.batch-list{padding:12px 20px 14px 64px;display:grid;gap:6px}
.batch{display:grid;grid-template-columns:120px 1fr 90px 130px 120px;gap:12px;align-items:center;font-size:13px;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.fifo-tag{font-size:11px;font-weight:600;color:var(--brand-soft-fg);background:var(--brand-soft);padding:2px 6px;border-radius:4px}

.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:260px;overflow:auto;padding:4px}

.req-line{display:grid;grid-template-columns:minmax(0,1fr) 80px 90px 96px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.req-line.head{font-size:12.5px;color:var(--muted-fg);font-weight:500;padding:0 0 8px}
.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.meta{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.meta>span{font-size:12px;color:var(--muted-fg);display:block;margin-bottom:3px}
.meta b{font-size:13.5px;font-weight:500}
.note{padding:12px 14px;border-radius:10px;background:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:20px}
.note .who{font-size:12px;color:var(--muted-fg);margin-bottom:4px}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:22px}
.tl{display:grid;grid-template-columns:20px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--border)}
.tl:last-child::before{display:none}
.tl-dot{width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted-fg)}
.tl-dot.done{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tl b{font-size:13.5px;font-weight:500;display:block}
.tl span{font-size:12.5px;color:var(--muted-fg)}

.req-compose{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.draft-line{display:grid;grid-template-columns:minmax(0,1fr) 84px 32px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.sugg{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.sugg:last-child{border-bottom:none}

/* ============ Responsive ============ */
.mobile-only{display:none}
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pos{grid-template-columns:minmax(0,1fr) 360px}
  .search-trigger{width:200px}
}
@media (max-width:980px){
  .dash-main,.req-compose{grid-template-columns:minmax(0,1fr)}
  .attention{grid-template-columns:minmax(0,1fr)}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .settings-row{grid-template-columns:minmax(0,1fr);gap:12px}
}
@media (max-width:860px){
  .sidebar{position:fixed;z-index:60;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-xl);padding-top:env(safe-area-inset-top,0px)}
  .sidebar.collapsed{width:272px}
  .sidebar.mobile-open{transform:none}
  .collapsed .sb-meta,.collapsed .sb-chev,.collapsed .sync-card{display:block}
  .collapsed .sb-item .sb-text{display:inline}
  .collapsed .sb-item{justify-content:flex-start;padding:0 9px}
  .collapsed .sb-label{opacity:1;height:32px}
  .inset{margin:0;border-radius:0;border:none}
  .mobile-only{display:inline-flex}
  .desktop-only{display:none!important}
  .search-trigger{width:auto;margin-left:auto}
  .search-trigger .st-text,.search-trigger .kbd{display:none}
  .pos{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:auto;min-height:100%}
  .pos-list{max-height:52vh}
  .pos-search .input-icon .input{padding-right:12px}
  .cart{border-left:none;border-top:1px solid var(--border)}
  .cart-lines{max-height:320px}
  .prod{grid-template-columns:36px minmax(0,1fr) 84px 32px}
  .prod .prod-stock{display:none}
  .page{padding:18px 16px 32px}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{display:none}
  .login-form{padding:24px 20px}
  .cols-3{grid-template-columns:minmax(0,1fr)}
  .meta-grid{grid-template-columns:1fr 1fr}
  .batch{grid-template-columns:1fr 1fr}
  .batch-list{padding-left:20px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .sync-pill .sp-text{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .page-title{font-size:21px}
}

.req-note{margin-top:20px}

/* ---- v2 additions ---- */
.pos-cat{width:220px;flex:none}
.pos-cat .select{height:44px;font-size:14px}
.draft-scroll{margin-top:12px;max-height:300px;overflow-y:auto;margin-right:-8px;padding-right:8px;border-bottom:1px solid var(--border)}
.draft-scroll .draft-line:last-child{border-bottom:none}
.check-row{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.check-row .checkbox{margin-top:2px}
.check-box{padding:12px 14px;border:1px solid var(--border);border-radius:10px}
/* Thin, trackless scrollbars */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted-fg) 45%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted-fg) 40%,transparent);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted-fg) 65%,transparent);background-clip:padding-box}
@media (max-width:860px){.pos-cat{width:150px}}

.form-section{font-size:12.5px;font-weight:600;color:var(--muted-fg);margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sheet-body>div>.form-section:first-child{margin-top:0}
.day-picker{display:flex;flex-wrap:wrap;gap:6px}
.day-picker .chip{min-width:48px}
.pw-toggle{position:absolute;right:6px;width:28px;height:28px;border:none;background:transparent;border-radius:6px;color:var(--muted-fg);display:flex;align-items:center;justify-content:center}
.pw-toggle:hover{background:var(--accent);color:var(--fg)}

</style>

  else if (d.mode === 'formula') { const r = evalFormula(d.expr, { ...ctx, total: base }); if (!r.ok) return { amount: 0, note: r.err }; v = r.value; }
  const cap = num(d.cap); if (cap > 0) v = Math.min(v, cap);
  v = Math.max(0, Math.min(v, base));
  return { amount: +v.toFixed(2), note: '' };
}
const discShort = d => d.mode === 'percent' ? d.value + '%' : d.mode === 'fixed' ? peso(d.value) : d.mode === 'perItem' ? peso(d.value) + ' per item' : 'Formula';

function saleTotals(cart, discount, prefs) {
  const rate = Math.max(0, parseFloat(prefs.tax) || 0) / 100;
  const inclusive = prefs.taxMode === 'inclusive';
  const lines = cart.map(l => ({ qty: l.qty, unitPrice: l.price, lineTotal: l.qty * l.price, taxable: l.taxable !== false }));
  const subtotal = +lines.reduce((a, l) => a + l.lineTotal, 0).toFixed(2);
  const taxableSub = lines.filter(l => l.taxable).reduce((a, l) => a + l.lineTotal, 0);
  const nonTaxSub = subtotal - taxableSub;
  const itemCount = cart.reduce((a, l) => a + l.qty, 0);
  const exempt = !!(discount && discount.vatExempt);
  // vatBase = what the basket costs with VAT taken out of the taxable items
  const vatBase = inclusive ? taxableSub / (1 + rate) + nonTaxSub : subtotal;
  const { amount: disc, note } = discountAmount(discount, { subtotal, itemCount, vatBase, lines });
  let tax = 0, total, vatable = 0, nonVat = 0;
  if (exempt) { total = vatBase - disc; nonVat = total; }
  else {
    const keep = subtotal > 0 ? (subtotal - disc) / subtotal : 0; // discount spread across lines by value
    const taxAfter = taxableSub * keep, nonAfter = nonTaxSub * keep;
    if (inclusive) { tax = taxAfter - taxAfter / (1 + rate); total = taxAfter + nonAfter; vatable = taxAfter - tax; }
    else { tax = taxAfter * rate; total = taxAfter + nonAfter + tax; vatable = taxAfter; }
    nonVat = nonAfter;
  }
  return { subtotal, itemCount, discount: disc, discNote: note, tax: +tax.toFixed(2), total: +Math.max(0, total).toFixed(2), exempt,
    vatExemptAmt: exempt && inclusive ? +(taxableSub - taxableSub / (1 + rate)).toFixed(2) : 0, vatable: +vatable.toFixed(2), nonVat: +nonVat.toFixed(2), hasNonTax: nonTaxSub > 0, rate, inclusive };
}

function useSize(ref) {

}
function useOutside(ref, onOut, active) {
  useEffect(() => { if (!active) return; const f = e => { if (ref.current && !ref.current.contains(e.target)) onOut(); }; const k = e => { if (e.key === 'Escape') onOut(); };

}

  useEffect(() => { if (!active) return; const k = e => { if (e.key === 'Escape') fn(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [active, fn]);
}

function Menu({ trigger, children, align = 'left', side = 'bottom', width, block }) {
  const [open, setOpen] = useState(false); const [pos, setPos] = useState(null);
  const ref = useRef(); const menuRef = useRef();
  const place = () => {
    if (!ref.current) return; const r = ref.current.getBoundingClientRect(); const vw = window.innerWidth, vh = window.innerHeight;
    const mh = menuRef.current ? menuRef.current.offsetHeight : 180; const mw = Math.max(width || 200, menuRef.current ? menuRef.current.offsetWidth : 0);
    let top = side === 'top' ? r.top - mh - 6 : r.bottom + 6;
    if (side !== 'top' && top + mh > vh - 8 && r.top - mh - 6 > 8) top = r.top - mh - 6;   // flip up when there’s no room below
    if (side === 'top' && top < 8) top = r.bottom + 6;
    let left = align === 'right' ? r.right - mw : r.left; left = Math.max(8, Math.min(left, vw - mw - 8));
    setPos({ top, left, minWidth: width });
  };
  useEffect(() => {
    if (!open) return; place(); const raf = requestAnimationFrame(place);
    const close = e => { if (ref.current && ref.current.contains(e.target)) return; if (menuRef.current && menuRef.current.contains(e.target)) return; setOpen(false); };
    const esc = e => { if (e.key === 'Escape') setOpen(false); };
    const off = () => setOpen(false);
    document.addEventListener('mousedown', close); document.addEventListener('keydown', esc); window.addEventListener('resize', off); window.addEventListener('scroll', off, true);
    return () => { cancelAnimationFrame(raf); document.removeEventListener('mousedown', close); document.removeEventListener('keydown', esc); window.removeEventListener('resize', off); window.removeEventListener('scroll', off, true); };
  }, [open]);
  return html`<div ref=${ref} style=${{ display: block ? 'block' : 'inline-block' }}>
    ${trigger({ open, toggle: () => setOpen(o => !o) })}
    ${open && ReactDOM.createPortal(html`<div ref=${menuRef} className="menu" role="menu" style=${{ position: 'fixed', ...(pos || { top: -9999, left: -9999 }) }}
      onClick=${e => { if (e.target.closest('.menu-item')) setOpen(false); }}>${children}</div>`, document.body)}
  </div>`;
}
function Checkbox({ checked, onChange, label, desc }) {

    if (ql.length >= 2) {

      hits.forEach(p => { const st = sIdx[p.sku + '|' + branch]; const qty = st ? st.qty : 0;
        out.push({ group: 'Products at this branch', label: prodName(p), sub: p.generic, icon: 'pill', right: qty > 0 ? int(qty) + ' in stock · ' + peso(p.price) : 'Out of stock', disabled: qty <= 0, run: () => { addToCart(p); go('pos'); } }); });
    }
    pages.filter(p => !ql || p.label.toLowerCase().includes(ql)).forEach(p => out.push({ group: 'Go to', label: p.label, icon: p.icon, run: () => go(p.id) }));
    actions.filter(a => !ql || a.label.toLowerCase().includes(ql)).forEach(a => out.push(a));

/* ================= Chart ================= */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; }
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ' C' + c1[0] + ',' + c1[1] + ' ' + c2[0] + ',' + c2[1] + ' ' + p2[0] + ',' + p2[1];
  }
  return d;
}
function AreaChart({ labels, series, height = 260 }) {
  const ref = useRef(); const { w } = useSize(ref); const [hover, setHover] = useState(null);
  const padL = 52, padR = 24, padT = 12, padB = 28;
  const W = Math.max(0, w), H = height, iw = Math.max(1, W - padL - padR), ih = H - padT - padB;
  const max = niceMax(Math.max(...series.flatMap(s => s.values)) * 1.08);
  const x = i => padL + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1));
  const y = v => padT + ih - (v / max) * ih;
  const ticks = [0, .25, .5, .75, 1].map(t => t * max);
  const onMove = e => { const r = ref.current.getBoundingClientRect(); const mx = e.clientX - r.left; const i = Math.round((mx - padL) / (iw / Math.max(1, labels.length - 1))); setHover(Math.max(0, Math.min(labels.length - 1, i))); };
  const every = Math.ceil(labels.length / Math.max(1, Math.floor(iw / 64)));
  return html`<div className="chart-box" ref=${ref} style=${{ height }} onMouseMove=${onMove} onMouseLeave=${() => setHover(null)}>
    ${W > 0 && html`<svg width=${W} height=${H} role="img" aria-label="Sales trend chart">
      <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--chart-1)" stop-opacity=".22" /><stop offset="100%" stop-color="var(--chart-1)" stop-opacity="0" /></linearGradient></defs>
      ${ticks.map((t, i) => html`<g key=${i}><line x1=${padL} x2=${W - padR} y1=${y(t)} y2=${y(t)} stroke="var(--border)" stroke-dasharray=${i === 0 ? '' : '3 4'} />
        <text x=${padL - 10} y=${y(t) + 4} text-anchor="end" font-size="11.5" fill="var(--muted-fg)" style=${{ fontVariantNumeric: 'tabular-nums' }}>${pesoShort(t).replace('.00', '')}</text></g>`)}
      ${labels.map((l, i) => (i % every === 0 || i === labels.length - 1) && html`<text key=${i} x=${x(i)} y=${H - 8} text-anchor="middle" font-size="11.5" fill="var(--muted-fg)">${l}</text>`)}
      ${series.map((s, si) => { const pts = s.values.map((v, i) => [x(i), y(v)]); const d = smoothPath(pts);
        return html`<g key=${si}>${s.fill && html`<path d=${d + ' L' + x(labels.length - 1) + ',' + y(0) + ' L' + x(0) + ',' + y(0) + ' Z'} fill="url(#gArea)" />`}
          <path d=${d} fill="none" stroke=${s.color} stroke-width=${s.fill ? 2.25 : 1.5} stroke-dasharray=${s.dashed ? '4 4' : ''} stroke-linecap="round" /></g>`; })}
      ${hover != null && html`<g><line x1=${x(hover)} x2=${x(hover)} y1=${padT} y2=${padT + ih} stroke="var(--ring)" stroke-width="1" />
        ${series.map((s, si) => html`<circle key=${si} cx=${x(hover)} cy=${y(s.values[hover])} r=${s.fill ? 4.5 : 3.5} fill="var(--bg)" stroke=${s.color} stroke-width="2" />`)}</g>`}
    </svg>`}
    ${hover != null && W > 0 && html`<div className="chart-tip" style=${{ left: Math.min(Math.max(x(hover), 90), W - 90), top: Math.min(...series.map(s => y(s.values[hover]))) - 12 }}>
      <div className="t">${labels[hover]}</div>
      ${series.map((s, si) => html`<div key=${si} className="l"><i style=${{ background: s.color }} />${s.name}<b>${peso(s.values[hover])}</b></div>`)}
    </div>`}
  </div>`;
}
