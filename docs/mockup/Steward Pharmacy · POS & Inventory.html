      .sort((a, b) => (b.qty > 0) - (a.qty > 0) || (ql ? 0 : a.p.sku.localeCompare(b.p.sku)));
  }, [q, cat, db.products, sIdx, branch]);
  const shown = results.slice(0, 60);
  const discount = db.discounts.find(d => d.id === pos.discountId) || null;
  const t = saleTotals(pos.cart, discount, db.prefs);
  const cash = parseFloat(pos.cash) || 0;
  const change = pos.pay === 'cash' ? cash - t.total : 0;
  const refOk = /^\d{13}$/.test(pos.ref.replace(/\s/g, ''));
  const canCharge = pos.cart.length > 0 && t.total > 0 && (pos.pay === 'cash' ? cash >= t.total - 0.001 : refOk);
  const setQty = (sku, n) => { const max = (sIdx[sku + '|' + branch] || { qty: 0 }).qty;
    if (n > max) { toast({ title: 'Only ' + max + ' in stock', desc: 'You can’t sell more than what’s on the shelf.', kind: 'warning' }); n = max; }
    setPos(s => ({ ...s, cart: n <= 0 ? s.cart.filter(l => l.sku !== sku) : s.cart.map(l => l.sku === sku ? { ...l, qty: n } : l) })); };
  const charge = () => { if (!canCharge) return; const sale = completeSale(t, discount); if (sale) setDone(sale); };
  useEffect(() => {
    const k = e => { const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (e.key === '/' && !inField) { e.preventDefault(); searchRef.current.focus(); }
      if (e.key === 'F9') { e.preventDefault(); charge(); }
      if (e.key === 'F8') { e.preventDefault(); cashRef.current && cashRef.current.focus(); }
      if (e.key === 'F7') { e.preventDefault(); setPos(s => ({ ...s, pay: s.pay === 'cash' ? 'gcash' : 'cash' })); } };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  });
  const quick = useMemo(() => { const tt = t.total; if (!tt) return []; const s = new Set(); [50, 100, 500, 1000].forEach(u => { const v = Math.ceil(tt / u) * u; if (v > tt + 0.001) s.add(v); }); return [...s].sort((a, b) => a - b).slice(0, 3); }, [t.total]);
  const locked = user.role === 'cashier';

  return html`<div className="pos">
    <section className="pos-left" aria-label="Products">
      <div className="pos-search">
        <div className="row gap-2">
        <div className="input-icon grow"><${Icon} name="search" size=${18} />
          <input ref=${searchRef} className="input" autoFocus value=${q} placeholder="Search by brand, generic name or SKU" aria-label="Search products"
            onChange=${e => setQ(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter') { const top = results.find(r => r.qty > 0); if (top) { addToCart(top.p); setQ(''); } } if (e.key === 'Escape') setQ(''); }} />
          <span className="kbd desktop-only" style=${{ right: 10 }}>↵ adds top result</span>
        </div>
        <${Select} value=${cat} onChange=${setCat} ariaLabel="Category" className="pos-cat"
          options=${[{ value: 'All', label: 'All categories' }, ...catCounts.map(([c, n]) => ({ value: c, label: c + ' (' + n + ')' }))]} />
        </div>
      </div>
      <div className="pos-list">
        ${shown.length === 0 ? html`<${Empty} icon="search" title="No products match “${q}”">Check the spelling, or try the generic name instead of the brand.<//>` :
          shown.map(({ p, qty }, i) => { const out = qty <= 0; const inCart = pos.cart.find(l => l.sku === p.sku);
            return html`<button key=${p.sku} type="button" className=${cx('prod', i === 0 && q && !out && 'top')} disabled=${out} onClick=${() => addToCart(p)}>
              <div className="prod-thumb"><${Icon} name="pill" size=${18} /></div>
              <div style=${{ minWidth: 0 }}><div className="prod-name truncate">${prodName(p)}</div><div className="prod-sub truncate">${p.generic} · <span className="mono">${p.sku}</span>${p.taxable === false && ' · Non-VAT'}${inCart && html` · <span style=${{ color: 'var(--brand-soft-fg)', fontWeight: 500 }}>${inCart.qty} in cart</span>`}</div></div>
              <div className="prod-stock">${out ? html`<${Badge} variant="danger">Out of stock<//>` : qty < low ? html`<${Badge} variant="warning">${qty} left<//>` : html`<span className="num muted" style=${{ fontSize: 13 }}>${int(qty)} in stock</span>`}</div>
              <div className="prod-price">${peso(p.price)}</div>
              <div className="prod-add" aria-hidden="true"><${Icon} name="plus" size=${16} /></div>
            </button>`; })}
      </div>
      <div className="pos-listfoot"><span className="num">${results.length > shown.length ? 'Showing 60 of ' + int(results.length) + ' · refine your search' : int(results.length) + ' products'}</span>
        <span className="desktop-only row gap-2" style=${{ marginLeft: 'auto' }}><span className="kbd">/</span> Search <span className="kbd">F7</span> Cash or GCash <span className="kbd">F8</span> Amount <span className="kbd">F9</span> Charge</span></div>
    </section>

    <aside className="cart" aria-label="Current sale">
      <div className="cart-head">
        <h2>Current sale</h2>${pos.cart.length > 0 && html`<${Badge} variant="secondary">${t.itemCount} ${t.itemCount === 1 ? 'item' : 'items'}<//>`}
        <span className="grow" />
        ${pos.cart.length > 0 && html`<${Button} variant="ghost" size="xs" onClick=${app.clearCart}><${Icon} name="trash-2" size=${13} />Clear<//>`}
      </div>
      <div className="cart-lines">
        ${pos.cart.length === 0 ? html`<${Empty} icon="shopping-cart" title="Cart is empty">Search or tap a product to add it here.<//>` :
          pos.cart.map(l => { const p = pMap[l.sku]; const max = (sIdx[l.sku + '|' + branch] || { qty: 0 }).qty;
            return html`<div key=${l.sku} className="cline">
              <div style=${{ minWidth: 0 }}><div className="cline-name">${prodName(p)}</div><div className="cline-sub num">${peso(l.price)} each · ${p.generic}${p.taxable === false ? ' · Non-VAT' : ''}</div></div>
              <div className="cline-total">${peso(l.qty * l.price)}</div>
              <${Stepper} value=${l.qty} max=${max} onChange=${n => setQty(l.sku, n)} />
              <${Button} variant="ghost" size="xs" icon aria-label=${'Remove ' + prodName(p)} onClick=${() => setQty(l.sku, 0)} style=${{ justifySelf: 'end' }}><${Icon} name="x" size=${14} /><//>
            </div>`; })}
      </div>
      <div className="cart-sum">
        <div className="sum-line"><span>Subtotal</span><b>${peso(t.subtotal)}</b></div>
        <div className="sum-line" style=${{ gap: 12 }}>
          <${Select} size="sm" value=${pos.discountId} ariaLabel="Discount" onChange=${v => setPos(s => ({ ...s, discountId: v }))} style=${{ maxWidth: 210 }}
            options=${[{ value: 'none', label: 'No discount' }, ...db.discounts.map(d => ({ value: d.id, label: d.name + ' · ' + discShort(d) }))]} />
          <b style=${{ color: t.discount > 0 ? 'var(--success-fg)' : undefined }}>${t.discount > 0 ? '−' + peso(t.discount) : peso(0)}</b>
        </div>
        ${t.discNote && html`<div className="cell-sub" style=${{ color: 'var(--warning-fg)' }}>${t.discNote}</div>`}
        ${t.exempt ? html`<div className="sum-line"><span>VAT exempt (${discount.name})</span><b>−${peso(t.vatExemptAmt)}</b></div>`
          : html`<div className="sum-line"><span>VAT ${t.inclusive ? 'included' : 'added'} · ${(t.rate * 100).toFixed(0)}%${t.hasNonTax ? ' on taxable items' : ''}</span><b>${peso(t.tax)}</b></div>`}
        <div className="sum-total"><span>Total due</span><strong>${peso(t.total)}</strong></div>
        <div className="pay-methods" role="group" aria-label="Payment method" style=${{ marginTop: 6 }}>
          ${[['cash', 'banknote', 'Cash'], ['gcash', 'smartphone', 'GCash']].map(([v, ic, l]) => html`
            <button key=${v} type="button" className="pay" aria-pressed=${pos.pay === v} onClick=${() => setPos(s => ({ ...s, pay: v }))}><${Icon} name=${ic} size=${15} />${l}</button>`)}
        </div>
        ${pos.pay === 'cash' ? html`<${Fragment}>
          <div className="row gap-2">
            <div className="input-icon grow"><span style=${{ position: 'absolute', left: 12, color: 'var(--muted-fg)', fontSize: 14 }}>₱</span>
              <input ref=${cashRef} className="input num" inputMode="decimal" placeholder="Cash received" aria-label="Cash received" style=${{ paddingLeft: 28 }} value=${pos.cash}
                onChange=${e => setPos(s => ({ ...s, cash: e.target.value.replace(/[^\d.]/g, '') }))} onKeyDown=${e => { if (e.key === 'Enter') charge(); }} /></div>
          </div>
          <div className="quick-cash">
            <${Button} variant="outline" size="sm" disabled=${!t.total} onClick=${() => setPos(s => ({ ...s, cash: t.total.toFixed(2) }))}>Exact<//>
            ${quick.map(v => html`<${Button} key=${v} variant="outline" size="sm" className="num" onClick=${() => setPos(s => ({ ...s, cash: String(v) }))}>₱${int(v)}<//>`)}
          </div>
          <div className="sum-line"><span>Change</span><b style=${{ color: change > 0 ? 'var(--success-fg)' : change < 0 && pos.cash ? 'var(--danger-fg)' : undefined }}>${pos.cash ? (change < 0 ? 'Short ' + peso(-change) : peso(change)) : peso(0)}</b></div>
        <//>` : html`<div>
          <input ref=${cashRef} className="input mono" inputMode="numeric" placeholder="GCash reference no. (13 digits)" aria-label="GCash reference number" aria-invalid=${!!pos.ref && !refOk}
            value=${pos.ref} onChange=${e => setPos(s => ({ ...s, ref: e.target.value.replace(/[^\d\s]/g, '').slice(0, 16) }))} onKeyDown=${e => { if (e.key === 'Enter') charge(); }} />
          <div className="cell-sub" style=${{ marginTop: 6, color: pos.ref && !refOk ? 'var(--danger-fg)' : undefined }}>${pos.ref && !refOk ? 'Reference numbers are 13 digits. Copy it from the customer’s GCash receipt.' : 'Required. Found on the customer’s GCash confirmation screen.'}</div></div>`}
        <${Button} variant="brand" className="charge" disabled=${!canCharge} onClick=${charge}>
          <span>${pos.cart.length === 0 ? 'Add items to charge' : pos.pay === 'cash' && cash < t.total ? 'Enter cash received' : pos.pay === 'gcash' && !refOk ? 'Enter GCash reference' : 'Charge ' + peso(t.total)}</span><span className="kbd desktop-only">F9</span><//>
      </div>
    </aside>

    <${Dialog} open=${!!done} onClose=${() => setDone(null)} width=${420} bodyStyle=${{ padding: 0 }}
      footer=${done && html`<${Button} variant="outline" onClick=${() => toast({ title: 'Sent to receipt printer', desc: done.or + ' · ' + branchName, kind: 'info' })}><${Icon} name="printer" />Print<//><${Button} autoFocus onClick=${() => { setDone(null); searchRef.current && searchRef.current.focus(); }}>New sale<//>`}>
      ${done && html`<div style=${{ padding: '24px 24px 16px', textAlign: 'center' }}>
        <div className="success-ring"><${Icon} name="check" size=${22} stroke=${2.5} /></div>
        <h2 className="dialog-title">${done.change > 0 ? 'Give ' + peso(done.change) + ' change' : 'Payment received'}</h2>
        <p className="dialog-desc">${done.or} · ${peso(done.amount)} ${done.payment}${done.pending ? ' · saved offline' : ''}</p></div>
        <${Receipt} sale=${done} />`}
    <//>
  </div>`;
}

/* ================= Inventory ================= */
function Inventory() {
  const app = useApp();
  const { db, setDb, sIdx, branch, setBranch, user, low, params, toast } = app;
  const isAdmin = user.role === 'admin';
  const [q, setQ] = useState(''); const [cat, setCat] = useState('All'); const [form, setForm] = useState('All');
  const [status, setStatus] = useState(params.status || 'All'); const [sort, setSort] = useState('sku');
  const [page, setPage] = useState(0); const [open, setOpen] = useState({}); const [adding, setAdding] = useState(!!params.addStock);
  useEffect(() => { if (params.status) setStatus(params.status); if (params.addStock) setAdding(true); }, [params]);
  useEffect(() => setPage(0), [q, cat, form, status, sort, branch]);
  const PER = 20;
  const rows = useMemo(() => {
    const ql = q.trim().toLowerCase();
    let r = db.products.map(p => { const e = sIdx[p.sku + '|' + branch]; return { p, e, st: stockStatus(e, low) }; }).filter(x => x.e);
    if (ql) r = r.filter(({ p, e }) => (p.brand + ' ' + p.generic + ' ' + p.sku).toLowerCase().includes(ql) || e.batches.some(b => b.batch.toLowerCase().includes(ql)));
    if (cat !== 'All') r = r.filter(x => x.p.cat === cat);
    if (form !== 'All') r = r.filter(x => x.p.form === form);
    if (status !== 'All') r = r.filter(x => status === 'expiring' ? x.e.next && daysUntil(x.e.next) <= 90 && x.e.qty > 0 : x.st === status);
    const cmp = { sku: (a, b) => a.p.sku.localeCompare(b.p.sku), name: (a, b) => a.p.brand.localeCompare(b.p.brand), stock: (a, b) => a.e.qty - b.e.qty,
      expiry: (a, b) => (a.e.next || '9999').localeCompare(b.e.next || '9999'), price: (a, b) => b.p.price - a.p.price }[sort];
    return r.sort(cmp);
  }, [db.products, sIdx, branch, q, cat, form, status, sort, low]);
  const all = useMemo(() => db.products.filter(p => sIdx[p.sku + '|' + branch]), [db.products, sIdx, branch]);
  const value = all.reduce((a, p) => a + sIdx[p.sku + '|' + branch].qty * p.price, 0);
  const lowN = all.filter(p => { const e = sIdx[p.sku + '|' + branch]; return e.qty > 0 && e.qty < low; }).length;
  const outN = all.filter(p => sIdx[p.sku + '|' + branch].qty <= 0).length;
  const exp90 = db.batches.filter(b => b.branch === branch && b.qty > 0 && daysUntil(b.expiry) <= 90).length;
  const filtered = q || cat !== 'All' || form !== 'All' || status !== 'All';
  const pages = Math.ceil(rows.length / PER); const slice = rows.slice(page * PER, page * PER + PER);
  const branchName = (db.branches.find(b => b.id === branch) || {}).name;
  const cats = [...new Set(all.map(p => p.cat))].sort();
  return html`<div className="page">
    <div className="page-header">
      <div><h1 className="page-title">Inventory</h1><p className="page-desc">${int(all.length)} products on the shelf at ${branchName}</p></div>
      <div className="toolbar">
        <${Select} value=${branch} onChange=${setBranch} disabled=${!isAdmin} ariaLabel="Branch" style=${{ width: 210 }} options=${db.branches.map(b => ({ value: b.id, label: b.name }))} />
        ${isAdmin ? html`<${Button} onClick=${() => setAdding(true)}><${Icon} name="package-plus" />Add stock<//>`
          : html`<${Button} variant="outline" onClick=${() => app.go('requests')}><${Icon} name="send" />Request stock<//>`}
      </div>
    </div>
    <div className="grid kpis" style=${{ marginBottom: 20 }}>
      <${Card} className="kpi"><div className="kpi-top">Stock value<${Icon} name="wallet" /></div><div className="kpi-value">${peso(value)}</div><div className="kpi-foot">At retail price</div><//>
      <${Card} className="kpi"><div className="kpi-top">Best seller this month<${Icon} name="trending-up" /></div><div className="kpi-value" style=${{ fontSize: 20, marginTop: 14 }}>Paracetamol 500mg</div><div className="kpi-foot">1,240 units sold</div><//>
      <button type="button" className="card kpi" style=${{ textAlign: 'left', cursor: 'pointer' }} onClick=${() => setStatus('low')}><div className="kpi-top">Low or out of stock<${Icon} name="alert-triangle" /></div><div className="kpi-value">${lowN + outN}</div><div className="kpi-foot">${lowN} low · ${outN} out · below ${low} units</div></button>
      <button type="button" className="card kpi" style=${{ textAlign: 'left', cursor: 'pointer' }} onClick=${() => setStatus('expiring')}><div className="kpi-top">Expiring in 90 days<${Icon} name="calendar-clock" /></div><div className="kpi-value" style=${{ color: exp90 ? 'var(--brand-soft-fg)' : undefined }}>${exp90}</div><div className="kpi-foot">Batches with stock left</div></button>
    </div>
    <${Card}>
      <div style=${{ padding: '14px 16px', borderBottom: '1px solid var(--border)' }} className="toolbar">
        <div className="input-icon" style=${{ flex: '1 1 240px', maxWidth: 340 }}><${Icon} name="search" size=${15} /><input className="input input-sm" placeholder="Search brand, generic, SKU or batch" aria-label="Search inventory" value=${q} onChange=${e => setQ(e.target.value)} /></div>
        <${Select} size="sm" value=${cat} onChange=${setCat} ariaLabel="Category" options=${[{ value: 'All', label: 'All categories' }, ...cats]} />
        <${Select} size="sm" value=${form} onChange=${setForm} ariaLabel="Dosage form" options=${[{ value: 'All', label: 'All forms' }, ...FORMS]} />
        <${Select} size="sm" value=${status} onChange=${setStatus} ariaLabel="Status" options=${[{ value: 'All', label: 'Any status' }, { value: 'ok', label: 'In stock' }, { value: 'low', label: 'Low stock' }, { value: 'out', label: 'Out of stock' }, { value: 'expiring', label: 'Expiring ≤ 90 days' }]} />
        ${filtered && html`<${Button} variant="ghost" size="sm" onClick=${() => { setQ(''); setCat('All'); setForm('All'); setStatus('All'); }}>Reset<${Icon} name="x" size=${14} /><//>`}
        <span className="grow" />
        <${Select} size="sm" value=${sort} onChange=${setSort} ariaLabel="Sort" options=${[{ value: 'sku', label: 'Sort: SKU' }, { value: 'name', label: 'Sort: Name' }, { value: 'stock', label: 'Sort: Lowest stock' }, { value: 'expiry', label: 'Sort: Soonest expiry' }, { value: 'price', label: 'Sort: Highest price' }]} />
      </div>
      <div className="table-wrap">
        ${slice.length === 0 ? html`<${Empty} icon="package" title="No products match these filters" action=${html`<${Button} variant="outline" size="sm" onClick=${() => { setQ(''); setCat('All'); setForm('All'); setStatus('All'); }}>Clear filters<//>`}>Try a different search or reset the filters.<//>` : html`
        <table className="table"><thead><tr><th style=${{ width: 44 }}></th><th>Product</th><th className="desktop-only">Category</th><th className="r">Price</th><th className="r">On hand</th><th>Next expiry</th><th>Status</th></tr></thead>
        <tbody>${slice.map(({ p, e, st }) => { const isOpen = open[p.sku]; const d = e.next ? daysUntil(e.next) : null;
          return html`<${Fragment} key=${p.sku}>
            <tr className="clickable" onClick=${() => setOpen(o => ({ ...o, [p.sku]: !o[p.sku] }))} aria-expanded=${!!isOpen}>
              <td><${Icon} name="chevron-right" size=${15} className="muted" style=${{ transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }} /></td>
              <td><div className="cell-main">${p.brand} <span className="muted" style=${{ fontWeight: 400 }}>${clean(p.strength)} ${p.form}</span>${p.taxable === false && html` <${Badge} variant="outline" style=${{ height: 18, fontSize: 11, marginLeft: 4 }}>Non-VAT<//>`}</div><div className="cell-sub">${p.generic} · <span className="mono">${p.sku}</span></div></td>
              <td className="desktop-only"><${Badge} variant="outline">${p.cat}<//></td>
              <td className="r num">${peso(p.price)}</td>
              <td className="r num" style=${{ fontWeight: 500, color: e.qty <= 0 ? 'var(--danger-fg)' : e.qty < low ? 'var(--warning-fg)' : undefined }}>${int(e.qty)}</td>
              <td>${e.next ? html`<div className="num" style=${{ fontSize: 13 }}>${fmtDate(e.next)}</div><div className="cell-sub">${d <= 0 ? 'Expired' : 'in ' + d + ' days'}</div>` : html`<span className="muted">–</span>`}</td>
              <td><${StatusBadge} status=${st} /></td>
            </tr>
            ${isOpen && html`<tr className="expand-row"><td colSpan=${7}><div className="batch-list">
              <div className="row gap-2" style=${{ fontSize: 12.5, color: 'var(--muted-fg)', marginBottom: 2 }}><${Icon} name="layers" size=${14} />Batches sell first-expiry, first-out (FIFO)</div>
              ${e.batches.map((b, i) => { const bd = daysUntil(b.expiry); const firstLive = e.batches.find(x => x.qty > 0) === b;
                return html`<div key=${i} className="batch"><span className="mono">${b.batch}</span><span>${firstLive ? html`<span className="fifo-tag">Sells next</span>` : b.qty <= 0 ? html`<span className="muted">Depleted</span>` : html`<span className="muted">In line</span>`}</span>
                  <span className="num">${int(b.qty)} units</span><span className="num">${fmtDate(b.expiry)}</span>
                  <span>${html`<${Badge} variant=${bd <= 30 ? 'danger' : bd <= 90 ? 'warning' : 'secondary'}>${bd <= 0 ? 'Expired' : bd + ' days left'}<//>`}</span></div>`; })}
            </div></td></tr>`}
          <//>`; })}</tbody></table>`}
      </div>
      ${rows.length > 0 && html`<${Pager} page=${page} pages=${pages} total=${rows.length} from=${page * PER + 1} to=${Math.min(rows.length, page * PER + PER)} onPage=${setPage} noun="products" />`}
    <//>
    <${AddStockSheet} open=${adding} onClose=${() => setAdding(false)} />
  </div>`;
}

function ProductCombo({ value, onPick, placeholder = 'Search by brand, generic or SKU', exclude = [], showStockAt }) {
  const { db, sIdx } = useApp(); const [q, setQ] = useState(''); const [open, setOpen] = useState(false); const ref = useRef(); const [act, setAct] = useState(0);
  useOutside(ref, () => setOpen(false), open);
  const hits = useMemo(() => { const ql = q.trim().toLowerCase(); if (!ql) return []; return db.products.filter(p => !exclude.includes(p.sku) && (p.brand + ' ' + p.generic + ' ' + p.sku).toLowerCase().includes(ql)).slice(0, 8); }, [q, db.products, exclude]);
  const pick = p => { onPick(p); setQ(''); setOpen(false); };
  return html`<div className="combo" ref=${ref}>
    <div className="input-icon"><${Icon} name="search" size=${15} /><input className="input" value=${q} placeholder=${placeholder} aria-label="Search products"
      onFocus=${() => setOpen(true)} onChange=${e => { setQ(e.target.value); setOpen(true); setAct(0); }}
      onKeyDown=${e => { if (e.key === 'ArrowDown') { e.preventDefault(); setAct(a => Math.min(hits.length - 1, a + 1)); } if (e.key === 'ArrowUp') { e.preventDefault(); setAct(a => Math.max(0, a - 1)); } if (e.key === 'Enter' && hits[act]) { e.preventDefault(); pick(hits[act]); } }} /></div>
    ${open && q.trim() && html`<div className="combo-list">
      ${hits.length === 0 ? html`<div className="menu-label" style=${{ padding: 10 }}>No product matches “${q}”.</div>` : hits.map((p, i) => { const e = showStockAt && sIdx[p.sku + '|' + showStockAt];
        return html`<button key=${p.sku} type="button" className="menu-item" data-active=${i === act} onMouseMove=${() => setAct(i)} onClick=${() => pick(p)}>
          <${Icon} name="pill" className="muted" /><div className="grow" style=${{ minWidth: 0 }}><div className="truncate">${prodName(p)}</div><div className="cell-sub truncate">${p.generic} · <span className="mono">${p.sku}</span></div></div>
          ${showStockAt && html`<span className="cell-sub num">${e ? int(e.qty) + ' on hand' : 'Not carried'}</span>`}</button>`; })}
    </div>`}
  </div>`;
}

function AddStockSheet({ open, onClose }) {
  const app = useApp(); const { db, setDb, branch, toast } = app;
  const blank = { mode: 'existing', product: null, generic: '', brand: '', strength: '', form: 'Tab', cat: 'Analgesic', price: '', taxable: true, branch, batch: '', qty: '', expiry: '' };
  const [f, setF] = useState(blank); const [err, setErr] = useState({});
  useEffect(() => { if (open) { setF({ ...blank, branch }); setErr({}); } }, [open]);
  const set = (k, v) => { setF(s => ({ ...s, [k]: v })); setErr(e => ({ ...e, [k]: null })); };
  const save = () => {
    const e = {};
    if (f.mode === 'existing' && !f.product) e.product = 'Pick the product you’re receiving.';
    if (f.mode === 'new') { if (!f.generic.trim()) e.generic = 'Enter the generic name.'; if (!f.brand.trim()) e.brand = 'Enter the brand.'; if (!(parseFloat(f.price) > 0)) e.price = 'Enter a selling price above zero.'; }
    if (!/^\S{3,}$/.test(f.batch.trim())) e.batch = 'Enter the batch number printed on the box.';
    if (!(parseInt(f.qty, 10) > 0)) e.qty = 'Enter how many units arrived.';
    if (!f.expiry) e.expiry = 'Enter the expiry date.'; else if (daysUntil(f.expiry) <= 0) e.expiry = 'This batch has already expired.';
    setErr(e); if (Object.keys(e).length) return;
    let sku;
    setDb(d => {
      let products = d.products;
      if (f.mode === 'new') { const n = Math.max(...d.products.map(p => parseInt(p.sku.slice(3), 10))) + 1; sku = 'PS-' + n; products = [...products, { sku, generic: f.generic.trim(), brand: f.brand.trim(), strength: f.strength.trim(), form: f.form, cat: f.cat, price: +parseFloat(f.price).toFixed(2), taxable: f.taxable }]; }
      else sku = f.product.sku;
      const qty = parseInt(f.qty, 10); const bn = f.batch.trim().toUpperCase();
      const ex = d.batches.find(b => b.sku === sku && b.branch === f.branch && b.batch === bn);
      const batches = ex ? d.batches.map(b => b === ex ? { ...b, qty: b.qty + qty } : b) : [...d.batches, { sku, branch: f.branch, batch: bn, qty, expiry: f.expiry }];
      return { ...d, products, batches };
    });
    const name = f.mode === 'new' ? f.brand + ' ' + f.strength : prodName(f.product);
    toast({ title: 'Stock added', desc: int(f.qty) + ' units of ' + name + ' at ' + db.branches.find(b => b.id === f.branch).name + (app.online ? '' : ' · will sync when online') });
    onClose();
  };
  return html`<${Sheet} open=${open} onClose=${onClose} title="Add stock" desc="Record a delivery. Each delivery is its own batch so the oldest stock sells first."
    footer=${html`<${Button} variant="outline" onClick=${onClose}>Cancel<//><${Button} onClick=${save}>Add to inventory<//>`}>
    <${Tabs} value=${f.mode} onChange=${v => set('mode', v)} items=${[['existing', 'Existing product'], ['new', 'New product']]} ariaLabel="Product type" />
    <div style=${{ marginTop: 18 }}>
      ${f.mode === 'existing' ? html`<${Field} label="Product" error=${err.product}>
          ${f.product ? html`<div className="disc-card" style=${{ padding: '10px 12px' }}><div className="prod-thumb" style=${{ width: 34, height: 34 }}><${Icon} name="pill" /></div>
            <div className="grow"><div className="cell-main">${prodName(f.product)}</div><div className="cell-sub">${f.product.generic} · ${peso(f.product.price)} · ${f.product.taxable === false ? 'Non-VAT' : 'VATable'} · <span className="mono">${f.product.sku}</span></div></div>
            <${Button} variant="ghost" size="sm" onClick=${() => set('product', null)}>Change<//></div>`
          : html`<${ProductCombo} onPick=${p => set('product', p)} showStockAt=${f.branch} />`}<//>`
        : html`<div className="form-grid">
          <${Field} label="Generic name" error=${err.generic}><input className="input" placeholder="e.g. Cetirizine" value=${f.generic} onChange=${e => set('generic', e.target.value)} aria-invalid=${!!err.generic} /><//>
          <${Field} label="Brand" error=${err.brand}><input className="input" placeholder="e.g. Virlix" value=${f.brand} onChange=${e => set('brand', e.target.value)} aria-invalid=${!!err.brand} /><//>
          <${Field} label="Strength"><input className="input" placeholder="e.g. 10mg" value=${f.strength} onChange=${e => set('strength', e.target.value)} /><//>
          <${Field} label="Dosage form"><${Select} value=${f.form} onChange=${v => set('form', v)} options=${FORMS} ariaLabel="Dosage form" /><//>
          <${Field} label="Category"><${Select} value=${f.cat} onChange=${v => set('cat', v)} options=${CATS} ariaLabel="Category" /><//>
          <${Field} label="Selling price" error=${err.price}><input className="input num" inputMode="decimal" placeholder="0.00" value=${f.price} onChange=${e => set('price', e.target.value.replace(/[^\d.]/g, ''))} aria-invalid=${!!err.price} /><//>
          <div className="span-2 check-box"><${Checkbox} checked=${f.taxable} onChange=${v => set('taxable', v)} label="Is taxable"
            desc=${f.taxable ? 'VAT is charged on this product at checkout.' : 'Left out of the VAT tally, e.g. VAT-exempt maintenance medicines.'} /></div>
        </div>`}
      <div className="menu-sep" style=${{ margin: '22px 0' }} />
      <div className="form-grid">
        <${Field} label="Receiving branch" className="span-2"><${Select} value=${f.branch} onChange=${v => set('branch', v)} ariaLabel="Branch" options=${db.branches.map(b => ({ value: b.id, label: b.name }))} /><//>
        <${Field} label="Batch number" error=${err.batch}><input className="input mono" placeholder="e.g. B26-104" value=${f.batch} onChange=${e => set('batch', e.target.value)} aria-invalid=${!!err.batch} /><//>
        <${Field} label="Units received" error=${err.qty}><input className="input num" inputMode="numeric" placeholder="0" value=${f.qty} onChange=${e => set('qty', e.target.value.replace(/\D/g, ''))} aria-invalid=${!!err.qty} /><//>
        <${Field} label="Expiry date" error=${err.expiry} className="span-2"><input type="date" className="input" value=${f.expiry} onChange=${e => set('expiry', e.target.value)} aria-invalid=${!!err.expiry} /><//>
      </div>
    </div>
  <//>`;
}

/* ================= Requests ================= */
const PRIORITY = { urgent: ['Urgent', 'danger'], normal: ['Normal', 'secondary'], low: ['Low', 'outline'] };
const RSTATUS = { pending: ['Pending', 'warning'], approved: ['Approved', 'info'], fulfilled: ['Fulfilled', 'success'], declined: ['Declined', 'secondary'] };
const PriorityBadge = ({ p }) => html`<${Badge} variant=${PRIORITY[p][1]}>${p === 'urgent' && html`<${Icon} name="flame" size=${12} />`}${PRIORITY[p][0]}<//>`;
const ReqStatusBadge = ({ s }) => html`<${Badge} variant=${RSTATUS[s][1]} dot>${RSTATUS[s][0]}<//>`;

function Requests() { return useApp().user.role === 'admin' ? html`<${RequestsAdmin} />` : html`<${RequestsCashier} />`; }

function RequestsAdmin() {
  const app = useApp(); const { db } = app;
  const [br, setBr] = useState('all'); const [st, setSt] = useState('pending'); const [openId, setOpenId] = useState(null);
  const base = db.requests.filter(r => br === 'all' || r.branch === br);
  const list = base.filter(r => st === 'all' || r.status === st).sort((a, b) => (a.status === 'pending' && b.status === 'pending' ? (a.priority === 'urgent') === (b.priority === 'urgent') ? b.ts.localeCompare(a.ts) : a.priority === 'urgent' ? -1 : 1 : b.ts.localeCompare(a.ts)));
  const count = s => base.filter(r => s === 'all' || r.status === s).length;
  const pend = base.filter(r => r.status === 'pending');
  const bName = id => (db.branches.find(b => b.id === id) || {}).name || id;
  return html`<div className="page">
    <div className="page-header">
      <div><h1 className="page-title">Stock requests</h1><p className="page-desc">Branches ask central (Esperanza Buhangin) for stock. Approve what you can send, then mark it fulfilled when it arrives.</p></div>
      <div className="toolbar"><${Select} value=${br} onChange=${setBr} ariaLabel="Branch" style=${{ width: 200 }} options=${[{ value: 'all', label: 'All branches' }, ...db.branches.filter(b => !b.central).map(b => ({ value: b.id, label: b.name }))]} /></div>
    </div>
    <div className="grid cols-3" style=${{ marginBottom: 20 }}>
      <${Card} className="kpi"><div className="kpi-top">Awaiting your decision<${Icon} name="hourglass" /></div><div className="kpi-value">${pend.length}</div><div className="kpi-foot">${br === 'all' ? 'Across all branches' : bName(br)}</div><//>
      <${Card} className="kpi"><div className="kpi-top">Marked urgent<${Icon} name="flame" /></div><div className="kpi-value" style=${{ color: pend.some(r => r.priority === 'urgent') ? 'var(--danger-fg)' : undefined }}>${pend.filter(r => r.priority === 'urgent').length}</div><div className="kpi-foot">Needs a same-day transfer</div><//>
      <${Card} className="kpi"><div className="kpi-top">Units requested<${Icon} name="boxes" /></div><div className="kpi-value">${int(pend.reduce((a, r) => a + r.items.reduce((x, i) => x + i.qty, 0), 0))}</div><div className="kpi-foot">In pending requests</div><//>
    </div>
    <${Card}>
      <div style=${{ padding: '14px 16px', borderBottom: '1px solid var(--border)' }}>
        <${Tabs} value=${st} onChange=${setSt} ariaLabel="Status" items=${[['pending', 'Pending', count('pending')], ['approved', 'Approved', count('approved')], ['fulfilled', 'Fulfilled', count('fulfilled')], ['declined', 'Declined', count('declined')], ['all', 'All', count('all')]]} />
      </div>
      <div className="table-wrap">${list.length === 0 ? html`<${Empty} icon="inbox" title=${st === 'pending' ? 'You’re all caught up' : 'No requests here'}>${st === 'pending' ? 'No branch is waiting on you right now.' : 'Requests with this status will show up here.'}<//>` : html`
        <table className="table"><thead><tr><th>Request</th><th>Branch</th><th className="desktop-only">Requested by</th><th>Sent</th><th className="r">Items</th><th className="r desktop-only">Units</th><th>Priority</th><th>Status</th><th></th></tr></thead>
        <tbody>${list.map(r => html`<tr key=${r.id} className="clickable" onClick=${() => setOpenId(r.id)}>
          <td><span className="mono" style=${{ fontWeight: 500 }}>${r.id}</span>${r.pendingSync && html` <${Icon} name="cloud-off" size=${13} className="muted" style=${{ display: 'inline', verticalAlign: -2 }} />`}</td>
          <td className="cell-main">${bName(r.branch)}</td>
          <td className="desktop-only"><div className="row gap-2"><div className="avatar" style=${{ width: 24, height: 24, borderRadius: 6, fontSize: 10 }}>${initials(r.by)}</div>${r.by}</div></td>
          <td><div style=${{ fontSize: 13 }}>${relTime(r.ts)}</div><div className="cell-sub">${fmtDT(r.ts)}</div></td>
          <td className="r num">${r.items.length}</td><td className="r num desktop-only">${int(r.items.reduce((a, i) => a + i.qty, 0))}</td>
          <td><${PriorityBadge} p=${r.priority} /></td><td><${ReqStatusBadge} s=${r.status} /></td>
          <td className="r"><${Icon} name="chevron-right" size=${15} className="muted" /></td></tr>`)}</tbody></table>`}</div>
    <//>
    <${RequestSheet} id=${openId} onClose=${() => setOpenId(null)} />
  </div>`;
}

function RequestSheet({ id, onClose, readOnly }) {
  const app = useApp(); const { db, setDb, sIdx, user, toast } = app;
  const r = db.requests.find(x => x.id === id);
  const central = (db.branches.find(b => b.central) || db.branches[0]).id;
  const [alloc, setAlloc] = useState({}); const [reply, setReply] = useState(''); const [err, setErr] = useState('');
  useEffect(() => { if (r) { const a = {}; r.items.forEach(i => { const on = (sIdx[i.sku + '|' + central] || { qty: 0 }).qty; a[i.sku] = String(r.alloc ? r.alloc[i.sku] ?? 0 : Math.min(i.qty, on)); }); setAlloc(a); setReply(r.reply || ''); setErr(''); } }, [id]);
  if (!r) return null;
  const pMap = Object.fromEntries(db.products.map(p => [p.sku, p]));
  const bName = x => (db.branches.find(b => b.id === x) || {}).name || x;
  const units = r.items.reduce((a, i) => a + i.qty, 0);
  const canAct = !readOnly && user.role === 'admin';
  const update = patch => setDb(d => ({ ...d, requests: d.requests.map(x => x.id === r.id ? { ...x, ...patch } : x) }));
  const approve = () => {
    for (const i of r.items) { const on = (sIdx[i.sku + '|' + central] || { qty: 0 }).qty; const v = parseInt(alloc[i.sku], 10) || 0; if (v > on) { setErr('You can only send what central has on hand. Lower the amount for ' + prodName(pMap[i.sku]) + '.'); return; } }
    const a = Object.fromEntries(r.items.map(i => [i.sku, parseInt(alloc[i.sku], 10) || 0]));
    if (!Object.values(a).some(v => v > 0)) { setErr('Allocate at least one unit, or decline the request instead.'); return; }
    update({ status: 'approved', alloc: a, reply: reply.trim(), decidedBy: user.name, decidedTs: localTs() });
    toast({ title: r.id + ' approved', desc: int(Object.values(a).reduce((x, y) => x + y, 0)) + ' units allocated to ' + bName(r.branch) }); onClose();
  };
  const decline = () => { update({ status: 'declined', reply: reply.trim(), decidedBy: user.name, decidedTs: localTs() }); toast({ title: r.id + ' declined', desc: bName(r.branch) + ' will see your note.', kind: 'info' }); onClose(); };
  const fulfill = () => {
    setDb(d => { const batches = d.batches.map(b => ({ ...b })); const added = [];
      r.items.forEach(i => { const q = (r.alloc || {})[i.sku] || 0; if (!q) return; consumeFifo(batches, i.sku, central, q).forEach(t => {
        const ex = batches.find(b => b.sku === i.sku && b.branch === r.branch && b.batch === t.batch); if (ex) ex.qty += t.qty; else added.push({ sku: i.sku, branch: r.branch, batch: t.batch, qty: t.qty, expiry: t.expiry }); }); });
      return { ...d, batches: [...batches, ...added], requests: d.requests.map(x => x.id === r.id ? { ...x, status: 'fulfilled', fulfilledTs: localTs() } : x) }; });
    toast({ title: r.id + ' fulfilled', desc: 'Stock moved from central to ' + bName(r.branch) + ', oldest batches first.' }); onClose();
  };
  const steps = [
    { label: 'Sent by ' + r.by, ts: r.ts, done: true },
    r.status === 'declined' ? { label: 'Declined by ' + r.decidedBy, ts: r.decidedTs, done: true, icon: 'x' } : { label: r.decidedTs ? 'Approved by ' + r.decidedBy : 'Waiting for approval', ts: r.decidedTs, done: !!r.decidedTs },
    r.status !== 'declined' && { label: r.status === 'fulfilled' ? 'Delivered to ' + bName(r.branch) : 'Delivery to branch', ts: r.fulfilledTs, done: r.status === 'fulfilled' },
  ].filter(Boolean);
  const footer = canAct && r.status === 'pending' ? html`<${Button} variant="danger-outline" onClick=${decline}>Decline<//><${Button} onClick=${approve}><${Icon} name="check" />Approve allocation<//>`
    : canAct && r.status === 'approved' ? html`<${Button} variant="outline" onClick=${onClose}>Close<//><${Button} onClick=${fulfill}><${Icon} name="truck" />Mark fulfilled<//>`
    : html`<${Button} variant="outline" onClick=${onClose}>Close<//>`;
  return html`<${Sheet} open=${!!r} onClose=${onClose} title=${r.id} headExtra=${html`<${ReqStatusBadge} s=${r.status} />`} desc=${'From ' + bName(r.branch) + ' · ' + fmtDT(r.ts)} footer=${footer} width=${600}>
    <div className="meta-grid">
      <div className="meta"><span>Priority</span><b><${PriorityBadge} p=${r.priority} /></b></div>
      <div className="meta"><span>Products</span><b className="num">${r.items.length}</b></div>
      <div className="meta"><span>Units asked for</span><b className="num">${int(units)}</b></div>
    </div>
    ${r.note && html`<div className="note"><div className="who">${r.by} wrote</div>${r.note}</div>`}
    <div className="req-line head"><span>Product</span><span className="r" style=${{ textAlign: 'right' }}>Asked</span><span style=${{ textAlign: 'right' }}>At central</span><span style=${{ textAlign: 'right' }}>${r.status === 'pending' && canAct ? 'Send' : 'Allocated'}</span></div>
    ${r.items.map(i => { const p = pMap[i.sku]; const on = (sIdx[i.sku + '|' + central] || { qty: 0 }).qty; const v = parseInt(alloc[i.sku], 10) || 0;
      return html`<div key=${i.sku} className="req-line">
        <div style=${{ minWidth: 0 }}><div className="cell-main truncate">${prodName(p)}</div><div className="cell-sub truncate">${p && p.generic} · <span className="mono">${i.sku}</span></div></div>
        <span className="num" style=${{ textAlign: 'right' }}>${int(i.qty)}</span>
        <span className="num" style=${{ textAlign: 'right', color: on < i.qty ? 'var(--warning-fg)' : 'var(--muted-fg)' }}>${int(on)}</span>
        ${r.status === 'pending' && canAct ? html`<input className="input input-sm num" style=${{ textAlign: 'right' }} inputMode="numeric" aria-label=${'Units to send of ' + prodName(p)} aria-invalid=${v > on}
            value=${alloc[i.sku] || ''} onChange=${e => { setErr(''); setAlloc(a => ({ ...a, [i.sku]: e.target.value.replace(/\D/g, '') })); }} />`
          : html`<span className="num" style=${{ textAlign: 'right', fontWeight: 500 }}>${r.alloc ? int(r.alloc[i.sku] || 0) : '–'}</span>`}
      </div>`; })}
    ${err && html`<div className="error-text" style=${{ marginTop: 10 }}>${err}</div>`}
    ${r.status === 'pending' && canAct ? html`<${Field} label="Note to the branch" hint="Optional. Shown to the cashier with your decision." className="req-note"><textarea className="textarea" style=${{ marginTop: 0 }} placeholder="e.g. Two boxes short. The balance follows on Friday’s delivery." value=${reply} onChange=${e => setReply(e.target.value)} /><//>`
      : r.reply && html`<div className="note" style=${{ marginTop: 18 }}><div className="who">${r.decidedBy} replied</div>${r.reply}</div>`}
    <div style=${{ marginTop: 22 }}><div className="label">Timeline</div>
      <div className="timeline">${steps.map((s, i) => html`<div key=${i} className="tl"><div className=${cx('tl-dot', s.done && 'done')}><${Icon} name=${s.done ? (s.icon || 'check') : 'circle-dashed'} size=${11} stroke=${2.5} /></div>
        <div><b>${s.label}</b><span>${s.ts ? fmtDT(s.ts) : 'Not yet'}</span></div></div>`)}</div></div>
  <//>`;
}

function RequestsCashier() {
  const app = useApp(); const { db, setDb, sIdx, user, low, toast, online } = app;
  const my = user.branch; const bName = (db.branches.find(b => b.id === my) || {}).name;
  const [draft, setDraft] = useState([]); const [priority, setPriority] = useState('normal'); const [note, setNote] = useState(''); const [openId, setOpenId] = useState(null); const [err, setErr] = useState('');
  const pMap = useMemo(() => Object.fromEntries(db.products.map(p => [p.sku, p])), [db.products]);
  const sugg = useMemo(() => db.products.map(p => ({ p, e: sIdx[p.sku + '|' + my] })).filter(x => x.e && x.e.qty < low && !draft.some(d => d.sku === x.p.sku)).sort((a, b) => a.e.qty - b.e.qty).slice(0, 6), [db.products, sIdx, draft, low]);
  const mine = db.requests.filter(r => r.branch === my).sort((a, b) => b.ts.localeCompare(a.ts));
  const add = p => { setErr(''); setDraft(d => d.some(x => x.sku === p.sku) ? d : [...d, { sku: p.sku, qty: String(Math.max(10, low * 3)) }]); };
  const send = () => {
    const items = draft.map(d => ({ sku: d.sku, qty: parseInt(d.qty, 10) || 0 })).filter(i => i.qty > 0);
    if (!items.length) { setErr('Add at least one product with a quantity.'); return; }
    const id = 'REQ-' + db.nextReq;
    setDb(d => ({ ...d, nextReq: d.nextReq + 1, requests: [{ id, branch: my, by: user.name, ts: localTs(), priority, status: 'pending', note: note.trim(), items, pendingSync: !online }, ...d.requests] }));
    setDraft([]); setNote(''); setPriority('normal');
    toast({ title: id + ' sent to central', desc: online ? 'You’ll see the decision here.' : 'Saved offline. It sends when you reconnect.' });
  };
  return html`<div className="page">
    <div className="page-header"><div><h1 className="page-title">Stock requests</h1><p className="page-desc">Ask central for stock when ${bName} is running low.</p></div></div>
    <div className="req-compose">
      <${Card}>
        <${CardHeader} title="New request" desc="Search for products or pick from what’s running low." />
        <div className="card-content">
          <${ProductCombo} onPick=${add} exclude=${draft.map(d => d.sku)} showStockAt=${my} placeholder="Search any product to request" />
          ${draft.length === 0 ? html`<div className="empty" style=${{ padding: '28px 0 12px' }}><div className="empty-title">No products yet</div><p>Search above, or add one of the suggestions.</p></div>` : html`
            <div className="draft-scroll">${draft.map(d => { const p = pMap[d.sku]; const e = sIdx[d.sku + '|' + my];
              return html`<div key=${d.sku} className="draft-line">
                <div style=${{ minWidth: 0 }}><div className="cell-main truncate">${prodName(p)}</div><div className="cell-sub">${e ? int(e.qty) + ' on hand' : 'Not carried yet'}</div></div>
                <input className="input input-sm num" style=${{ textAlign: 'right' }} inputMode="numeric" aria-label=${'Quantity of ' + prodName(p)} value=${d.qty} onChange=${ev => setDraft(ds => ds.map(x => x.sku === d.sku ? { ...x, qty: ev.target.value.replace(/\D/g, '') } : x))} />
                <${Button} variant="ghost" size="sm" icon aria-label="Remove" onClick=${() => setDraft(ds => ds.filter(x => x.sku !== d.sku))}><${Icon} name="x" size=${14} /><//>
              </div>`; })}</div>`}
          <div className="form-grid" style=${{ marginTop: 18 }}>
            <${Field} label="Priority"><${Select} value=${priority} onChange=${setPriority} ariaLabel="Priority" options=${[{ value: 'low', label: 'Low · next scheduled delivery' }, { value: 'normal', label: 'Normal · within 2 days' }, { value: 'urgent', label: 'Urgent · same day' }]} /><//>
            <div />
            <${Field} label="Note for central" className="span-2"><textarea className="textarea" placeholder="e.g. Paracetamol runs out by Friday, walk-in demand is up." value=${note} onChange=${e => setNote(e.target.value)} /><//>
          </div>
          ${err && html`<div className="error-text">${err}</div>`}
        </div>
        <div className="card-footer"><span className="cell-sub">${draft.length} ${draft.length === 1 ? 'product' : 'products'} · ${int(draft.reduce((a, d) => a + (parseInt(d.qty, 10) || 0), 0))} units</span><span className="grow" />
          <${Button} disabled=${!draft.length} onClick=${send}><${Icon} name="send" />Send request<//></div>
      <//>
      <div className="stack">
        <${Card}>
          <${CardHeader} title="Running low" desc=${'Below ' + low + ' units at ' + bName} />
          <div className="card-content" style=${{ paddingTop: 6 }}>
            ${sugg.length === 0 ? html`<div className="cell-sub" style=${{ padding: '10px 0' }}>Nothing is running low right now.</div>` : sugg.map(({ p, e }) => html`<div key=${p.sku} className="sugg">
              <div className="grow"><div className="cell-main truncate">${prodName(p)}</div><div className="cell-sub">${e.qty <= 0 ? 'Out of stock' : e.qty + ' left'}</div></div>
              <${Button} variant="outline" size="xs" onClick=${() => add(p)}><${Icon} name="plus" size=${13} />Add<//></div>`)}
          </div>
        <//>

function Activity() {
  const app = useApp(); const { db, toast } = app;
  const [br, setBr] = useState('all'); const [period, setPeriod] = useState('daily'); const [q, setQ] = useState(''); const [pay, setPay] = useState('all');

  const list = useMemo(() => {
    const start = todayStart(); start.setDate(start.getDate() - PERIOD_DAYS[period]); const ql = q.trim().toLowerCase();
    return db.sales.filter(s => new Date(s.ts) >= start && (br === 'all' || s.branch === br) && (pay === 'all' || s.payment === pay) && (!ql || (s.or + ' ' + s.cashier).toLowerCase().includes(ql))).sort((a, b) => b.ts.localeCompare(a.ts));
  }, [db.sales, br, period, q, pay]);
  const tot = list.reduce((a, s) => ({ amt: a.amt + s.amount, items: a.items + s.items, disc: a.disc + s.discount }), { amt: 0, items: 0, disc: 0 });
  const PER = 20; const pages = Math.ceil(list.length / PER); const slice = list.slice(page * PER, page * PER + PER);

        <${Tabs} value=${period} onChange=${setPeriod} items=${PERIODS} ariaLabel="Period" />
        <${Button} variant="outline" onClick=${exportCsv} disabled=${!list.length}><${Icon} name="download" />Export CSV<//>
      </div>
    </div>
    <div className="grid kpis" style=${{ marginBottom: 20 }}>
      <${Card} className="kpi"><div className="kpi-top">Revenue<${Icon} name="wallet" /></div><div className="kpi-value">${peso(tot.amt)}</div><div className="kpi-foot">${SALES[period].label}</div><//>
      <${Card} className="kpi"><div className="kpi-top">Receipts issued<${Icon} name="receipt" /></div><div className="kpi-value">${int(list.length)}</div><div className="kpi-foot">${list.filter(s => s.pending).length ? list.filter(s => s.pending).length + ' waiting to sync' : 'All synced'}</div><//>
      <${Card} className="kpi"><div className="kpi-top">Items sold<${Icon} name="package" /></div><div className="kpi-value">${int(tot.items)}</div><div className="kpi-foot">${list.length ? (tot.items / list.length).toFixed(1) + ' per receipt' : 'No receipts'}</div><//>
      <${Card} className="kpi"><div className="kpi-top">Discounts given<${Icon} name="percent" /></div><div className="kpi-value">${peso(tot.disc)}</div><div className="kpi-foot">${list.filter(s => s.discount > 0).length} discounted receipts</div><//>
    </div>
    <${Card}>
      <div style=${{ padding: '14px 16px', borderBottom: '1px solid var(--border)' }} className="toolbar">
        <div className="input-icon" style=${{ flex: '1 1 220px', maxWidth: 300 }}><${Icon} name="search" size=${15} /><input className="input input-sm" placeholder="Search OR number or cashier" aria-label="Search sales" value=${q} onChange=${e => setQ(e.target.value)} /></div>
        <${Select} size="sm" value=${pay} onChange=${setPay} ariaLabel="Payment method" options=${[{ value: 'all', label: 'Any payment' }, 'Cash', 'GCash']} />
      </div>
      <div className="table-wrap">${slice.length === 0 ? html`<${Empty} icon="receipt" title="No sales in this range">Try a longer period or another branch.<//>` : html`
        <table className="table"><thead><tr><th>OR no.</th><th>Date & time</th><th>Branch</th><th className="desktop-only">Cashier</th><th className="r">Items</th><th className="r desktop-only">Discount</th><th>Payment</th><th className="r">Amount</th></tr></thead>
        <tbody>${slice.map(s => html`<tr key=${s.or} className="clickable" onClick=${() => setView(s)}>
          <td><span className="mono" style=${{ fontWeight: 500 }}>${s.or}</span>${s.pending && html` <${Badge} variant="warning" style=${{ marginLeft: 6 }}><${Icon} name="cloud-off" size=${11} />Queued<//>`}</td>
          <td className="num muted">${fmtDT(s.ts)}</td><td>${bName(s.branch)}</td><td className="desktop-only muted">${s.cashier}</td>

          <td><${Badge} variant="outline"><${Icon} name=${s.payment === 'Cash' ? 'banknote' : 'smartphone'} size=${12} />${s.payment}<//></td>
          <td className="r num" style=${{ fontWeight: 600 }}>${peso(s.amount)}</td></tr>`)}</tbody>
        <tfoot><tr><td colSpan=${2}>Total · ${int(list.length)} receipts</td><td className="desktop-only" /><td className="desktop-only" /><td className="r num">${int(tot.items)}</td><td className="r num desktop-only">${tot.disc ? '−' + peso(tot.disc) : '–'}</td><td /><td className="r num">${peso(tot.amt)}</td></tr></tfoot></table>`}</div>

      ${view && html`<${Receipt} sale=${view} />`}
    <//>
  </div>`;
}

    <div className="row" style=${{ marginBottom: 16 }}><p className="muted" style=${{ margin: 0, fontSize: 13.5 }}>Staff can only sell from and request stock for their assigned branch.</p><span className="grow" /><${Button} onClick=${openNew}><${Icon} name="plus" />Add staff<//></div>

      <tbody>${db.accounts.map(a => html`<tr key=${a.username} style=${a.active === false ? { opacity: .6 } : null}><td><div className="row gap-3"><div className="avatar">${initials(a.name)}</div><div><div className="cell-main">${a.name}${a.username === user.username && html` <span className="muted" style=${{ fontWeight: 400 }}>(you)</span>`}</div><div className="cell-sub mono">${a.username}</div></div></div></td>
        <td>${a.role === 'admin' ? html`<${Badge} variant="solid"><${Icon} name="shield-check" size=${12} />Super admin<//>` : html`<div style=${{ fontSize: 13 }}>${a.position || 'Cashier'}</div>${a.license && html`<div className="cell-sub">PRC ${a.license}</div>`}`}</td>
        <td className="muted" style=${{ fontSize: 13 }}>${a.role === 'admin' ? 'All branches' : bName(a.branch)}</td>
        <td className="desktop-only"><div className="num" style=${{ fontSize: 13 }}>${a.phone || html`<span className="muted">–</span>`}</div>${a.email && html`<div className="cell-sub truncate" style=${{ maxWidth: 200 }}>${a.email}</div>`}</td>
        <td>${a.active === false ? html`<${Badge} variant="secondary" dot>Inactive<//>` : html`<${Badge} variant="success" dot>Active<//>`}</td>
        <td className="r"><${Menu} align="right" width=${200} trigger=${({ toggle }) => html`<${Button} variant="ghost" size="sm" icon aria-label="Account actions" onClick=${toggle}><${Icon} name="more-horizontal" /><//>`}>
          <button type="button" className="menu-item" onClick=${() => { setErr({}); setShow(false); setDlg({ ...a, pass: '', pass2: '', position: a.position || 'Cashier', email: a.email || '', address: a.address || '', license: a.license || '', phone: a.phone || '' }); }}><${Icon} name="pencil" />Edit details</button>
          ${a.role !== 'admin' && html`<${Fragment}>
            <button type="button" className="menu-item" onClick=${() => setActive(a, a.active === false)}><${Icon} name=${a.active === false ? 'user' : 'lock'} />${a.active === false ? 'Mark as active' : 'Mark as inactive'}</button>
            <div className="menu-sep" />
            <button type="button" className="menu-item" style=${{ color: 'var(--danger-fg)' }} onClick=${() => setDel(a)}><${Icon} name="trash-2" />Delete account</button><//>`}
        <//></td></tr>`)}</tbody></table></div><//>
    <${Sheet} open=${!!dlg} onClose=${() => setDlg(null)} title=${dlg && dlg.isNew ? 'Add staff' : 'Edit staff'} desc=${dlg && dlg.isNew ? 'Share the username and temporary password with them in person.' : dlg && dlg.name} width=${560}
      footer=${html`<${Button} variant="outline" onClick=${() => setDlg(null)}>Cancel<//><${Button} onClick=${save}>${dlg && dlg.isNew ? 'Create account' : 'Save changes'}<//>`}>
      ${dlg && html`<div>
        <div className="form-section">Personal details</div>
        <div className="form-grid">
          <${Field} label="Full name" error=${err.name} className="span-2"><input className="input" autoFocus placeholder="e.g. Jo Santos" value=${dlg.name} onChange=${e => set('name', e.target.value)} aria-invalid=${!!err.name} /><//>
          <${Field} label="Contact number" error=${err.phone}><input className="input" inputMode="tel" placeholder="0917 123 4567" value=${dlg.phone} onChange=${e => set('phone', e.target.value)} aria-invalid=${!!err.phone} /><//>
          <${Field} label="Email" hint="Optional" error=${err.email}><input className="input" type="email" placeholder="name@email.com" value=${dlg.email} onChange=${e => set('email', e.target.value)} aria-invalid=${!!err.email} /><//>
          <${Field} label="Home address" hint="Optional" className="span-2"><textarea className="textarea" style=${{ minHeight: 60 }} placeholder="Street, barangay, city" value=${dlg.address} onChange=${e => set('address', e.target.value)} /><//>
        </div>
        <div className="form-section">Work</div>
        <div className="form-grid">
          ${!isAdminRow && html`<${Fragment}>
          <${Field} label="Position"><${Select} value=${dlg.position} onChange=${v => set('position', v)} ariaLabel="Position" options=${POSITIONS} /><//>
          <${Field} label="Assigned branch"><${Select} value=${dlg.branch} onChange=${v => set('branch', v)} ariaLabel="Branch" options=${db.branches.map(b => ({ value: b.id, label: b.name }))} /><//>
          ${dlg.position === 'Pharmacist' && html`<${Field} label="PRC license number" error=${err.license} className="span-2"><input className="input mono" inputMode="numeric" placeholder="e.g. 0012345" value=${dlg.license} onChange=${e => set('license', e.target.value.replace(/\D/g, ''))} aria-invalid=${!!err.license} /><//>`}
          <//>`}
          ${isAdminRow && html`<div className="span-2 cell-sub">Super admins can work at every branch.</div>`}
        </div>
        <div className="form-section">Sign-in</div>
        <div className="form-grid">
          <${Field} label="Username" error=${err.username} hint=${dlg.isNew ? 'Lowercase, no spaces' : 'Usernames can’t be changed'} className="span-2"><input className="input mono" disabled=${!dlg.isNew} placeholder="e.g. jsantos" value=${dlg.username} onChange=${e => set('username', e.target.value.toLowerCase().replace(/\s/g, ''))} aria-invalid=${!!err.username} /><//>
          <${Field} label=${dlg.isNew ? 'Temporary password' : 'New password'} error=${err.pass} hint=${dlg.isNew ? 'At least 6 characters' : 'Leave blank to keep the current one'}>
            <div className="input-icon"><input className="input" type=${show ? 'text' : 'password'} style=${{ paddingRight: 40, paddingLeft: 12 }} value=${dlg.pass} onChange=${e => set('pass', e.target.value)} aria-invalid=${!!err.pass} autoComplete="new-password" />
              <button type="button" className="pw-toggle" aria-label=${show ? 'Hide password' : 'Show password'} onClick=${() => setShow(v => !v)}><${Icon} name="eye" size=${15} /></button></div><//>
          <${Field} label="Confirm password" error=${err.pass2}><input className="input" type=${show ? 'text' : 'password'} value=${dlg.pass2} onChange=${e => set('pass2', e.target.value)} aria-invalid=${!!err.pass2} autoComplete="new-password" /><//>
          <div className="span-2"><${Button} variant="outline" size="sm" onClick=${() => { const p = genPassword(); setDlg(s => ({ ...s, pass: p, pass2: p })); setShow(true); setErr(x => ({ ...x, pass: null, pass2: null })); }}><${Icon} name="key-round" size=${14} />Generate a password<//></div>
          ${!isAdminRow && html`<div className="span-2 row gap-3" style=${{ padding: '12px 14px', border: '1px solid var(--border)', borderRadius: 10 }}>
            <div className="grow"><div className="cell-main">${dlg.active !== false ? 'Active' : 'Inactive'}</div><div className="cell-sub">Inactive staff can’t sign in. Use this for staff on leave instead of deleting their account.</div></div>
            <${Switch} checked=${dlg.active !== false} onChange=${v => set('active', v)} label="Active" /></div>`}
        </div>
      </div>`}<//>
    <${Dialog} open=${!!del} onClose=${() => setDel(null)} title=${del ? 'Delete ' + del.name + '’s account?' : ''} desc="They won’t be able to sign in. Their past sales stay in activity. To keep the account for later, mark it inactive instead."
      footer=${html`<${Button} variant="outline" onClick=${() => setDel(null)}>Cancel<//><${Button} variant="destructive" onClick=${() => { setDb(d => ({ ...d, accounts: d.accounts.filter(a => a.username !== del.username) })); toast({ title: 'Account deleted', kind: 'info' }); setDel(null); }}>Delete account<//>`} />
  </div>`;
}
function DiscountSettings() {
  const { db, setDb, toast } = useApp(); const [dlg, setDlg] = useState(null); const [err, setErr] = useState({}); const [del, setDel] = useState(null);
  const sample = { subtotal: 1000, itemCount: 10, vatBase: 1000 / 1.12, lines: [{ qty: 4, unitPrice: 100, lineTotal: 400 }, { qty: 6, unitPrice: 100, lineTotal: 600 }] };
  const preview = dlg ? discountAmount({ ...dlg, cap: dlg.cap, minSpend: dlg.minSpend }, sample) : null;
  const set = (k, v) => { setDlg(s => ({ ...s, [k]: v })); setErr(x => ({ ...x, [k]: null })); };
  const save = () => { const e = {}; const n = dlg.name.trim();
    if (!n) e.name = 'Name the discount the way cashiers will see it.'; else if (db.discounts.some(d => d.id !== dlg.id && d.name.toLowerCase() === n.toLowerCase())) e.name = 'A discount with that name already exists.';
    if (dlg.mode === 'formula') { const r = evalFormula(dlg.expr, sample); if (!r.ok) e.expr = r.err; } else if (!(parseFloat(dlg.value) > 0)) e.value = 'Enter a value above zero.';
    if (dlg.mode === 'percent' && parseFloat(dlg.value) > 100) e.value = 'A percentage can’t be over 100.';
    setErr(e); if (Object.keys(e).length) return;
    const rec = { ...dlg, name: n }; delete rec.isNew;
    setDb(d => ({ ...d, discounts: dlg.isNew ? [...d.discounts, { ...rec, id: 'd' + Date.now() }] : d.discounts.map(x => x.id === dlg.id ? rec : x) }));
    toast({ title: dlg.isNew ? 'Discount added' : 'Discount updated', desc: n + ' is available at every counter.' }); setDlg(null); };
  const describe = d => [d.mode === 'formula' ? 'Formula: ' + d.expr : discShort(d) + ' off', d.vatExempt && 'VAT-exempt', parseFloat(d.cap) > 0 && 'max ' + peso(d.cap), parseFloat(d.minSpend) > 0 && 'min spend ' + peso(d.minSpend)].filter(Boolean).join(' · ');
  return html`<div>
    <div className="row" style=${{ marginBottom: 16 }}><p className="muted" style=${{ margin: 0, fontSize: 13.5 }}>Cashiers pick one discount per sale from the checkout panel.</p><span className="grow" />
      <${Button} onClick=${() => { setErr({}); setDlg({ isNew: true, name: '', mode: 'percent', value: '', cap: '', minSpend: '', vatExempt: false, expr: '' }); }}><${Icon} name="plus" />Add discount<//></div>
    ${db.discounts.length === 0 ? html`<${Card}><${Empty} icon="percent" title="No discounts yet">Add Senior / PWD first. It’s required for most pharmacy sales in the Philippines.<//><//>` :
      db.discounts.map(d => html`<div key=${d.id} className="disc-card"><div className="disc-icon"><${Icon} name="tag" size=${17} /></div>
        <div className="grow"><div className="cell-main">${d.name}</div><div className="cell-sub">${describe(d)}</div></div>
        <${Button} variant="ghost" size="sm" onClick=${() => { setErr({}); setDlg({ ...d }); }}>Edit<//>
        <${Button} variant="ghost" size="sm" icon aria-label=${'Delete ' + d.name} onClick=${() => setDel(d)}><${Icon} name="trash-2" size=${15} /><//></div>`)}
    <${Dialog} open=${!!dlg} onClose=${() => setDlg(null)} title=${dlg && dlg.isNew ? 'Add discount' : 'Edit discount'} width=${540}
      footer=${html`<${Button} variant="outline" onClick=${() => setDlg(null)}>Cancel<//><${Button} onClick=${save}>${dlg && dlg.isNew ? 'Add discount' : 'Save changes'}<//>`}>
      ${dlg && html`<div className="stack" style=${{ gap: 16 }}>
        <${Field} label="Name" error=${err.name}><input className="input" autoFocus placeholder="e.g. Senior / PWD" value=${dlg.name} onChange=${e => set('name', e.target.value)} aria-invalid=${!!err.name} /><//>
        <div><div className="label">How it’s computed</div><${Tabs} value=${dlg.mode} onChange=${v => set('mode', v)} ariaLabel="Discount type" items=${[['percent', 'Percent'], ['fixed', 'Fixed amount'], ['perItem', 'Per item'], ['formula', 'Formula']]} /></div>
        ${dlg.mode === 'formula' ? html`<${Field} label="Formula" error=${err.expr} hint="Use subtotal, itemCount, vatBase, or per-line qty, unitPrice, lineTotal with min, max, round."><input className="input mono" placeholder="min(subtotal * 0.20, 500)" value=${dlg.expr} onChange=${e => set('expr', e.target.value)} aria-invalid=${!!err.expr} /><//>`
          : html`<${Field} label=${dlg.mode === 'percent' ? 'Percent off' : dlg.mode === 'fixed' ? 'Amount off' : 'Amount off per item'} error=${err.value}><div className="row gap-2" style=${{ maxWidth: 220 }}>${dlg.mode !== 'percent' && html`<span className="muted">₱</span>`}<input className="input num" inputMode="decimal" value=${dlg.value} onChange=${e => set('value', e.target.value.replace(/[^\d.]/g, ''))} aria-invalid=${!!err.value} />${dlg.mode === 'percent' && html`<span className="muted">%</span>`}</div><//>`}
        <div className="form-grid">
          <${Field} label="Maximum discount" hint="Optional"><input className="input num" inputMode="decimal" placeholder="No cap" value=${dlg.cap} onChange=${e => set('cap', e.target.value.replace(/[^\d.]/g, ''))} /><//>
          <${Field} label="Minimum spend" hint="Optional"><input className="input num" inputMode="decimal" placeholder="None" value=${dlg.minSpend} onChange=${e => set('minSpend', e.target.value.replace(/[^\d.]/g, ''))} /><//>
        </div>
        <div className="row gap-3" style=${{ padding: '12px 14px', border: '1px solid var(--border)', borderRadius: 10 }}>
          <div className="grow"><div className="cell-main">VAT-exempt sale</div><div className="cell-sub">Removes VAT first, then applies the discount. Required for senior citizen and PWD sales.</div></div>
          <${Switch} checked=${dlg.vatExempt} onChange=${v => set('vatExempt', v)} label="VAT-exempt sale" /></div>
        <div className="note" style=${{ margin: 0 }}><div className="who">Preview on a ₱1,000.00 sale of 10 items</div>${preview.note ? html`<span style=${{ color: 'var(--warning-fg)' }}>${preview.note}</span>` : html`Customer saves <b className="num">${peso(preview.amount)}</b>${dlg.vatExempt ? ' plus ' + peso(1000 - 1000 / 1.12) + ' VAT' : ''}.`}</div>
      </div>`}<//>
    <${Dialog} open=${!!del} onClose=${() => setDel(null)} title=${del ? 'Delete ' + del.name + '?' : ''} desc="Cashiers won’t see it at checkout anymore. Past receipts keep their discount."
      footer=${html`<${Button} variant="outline" onClick=${() => setDel(null)}>Cancel<//><${Button} variant="destructive" onClick=${() => { setDb(d => ({ ...d, discounts: d.discounts.filter(x => x.id !== del.id) })); toast({ title: del.name + ' deleted', kind: 'info' }); setDel(null); }}>Delete discount<//>`} />
  </div>`;
}

/* ================= App root ================= */
function App() {
  const [db, setDb] = useState(initDb);
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard'); const [params, setParams] = useState({});
  const [branch, setBranch] = useState('central');
  const [theme, setThemeState] = useState(() => store.get('theme', 'system'));
  const [collapsed, setCollapsed] = useState(() => store.get('collapsed', false)); const [mobileOpen, setMobileOpen] = useState(false);
  const [online, setOnlineState] = useState(true); const [syncing, setSyncing] = useState(false); const [lastSync, setLastSync] = useState(() => Date.now() - 12000);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [pos, setPos] = useState({ cart: [], discountId: 'none', pay: 'cash', cash: '', ref: '' });
  const mainRef = useRef();
  const sIdx = useMemo(() => stockIndex(db.batches), [db.batches]);
  const low = parseInt(db.prefs.low, 10) > 0 ? parseInt(db.prefs.low, 10) : 20;
  const queued = db.sales.filter(s => s.pending).length + db.requests.filter(r => r.pendingSync).length;

  const toast = useCallback(t => { const id = Math.random().toString(36).slice(2); setToasts(l => [...l.slice(-2), { ...t, id }]); setTimeout(() => setToasts(l => l.filter(x => x.id !== id)), t.kind === 'error' ? 6000 : 3800); }, []);
  const setTheme = v => { setThemeState(v); store.set('theme', v); };
  useEffect(() => { store.set('collapsed', collapsed); }, [collapsed]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => document.documentElement.setAttribute('data-theme', theme === 'system' ? (mq.matches ? 'dark' : 'light') : theme);
    apply(); mq.addEventListener('change', apply); return () => mq.removeEventListener('change', apply);
  }, [theme]);
  useEffect(() => { const k = e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && user && user.role === 'admin') { e.preventDefault(); setCmdOpen(o => !o); } }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [user]);
  useEffect(() => { const t = setInterval(() => setLastSync(x => x), 30000); return () => clearInterval(t); }, []);

  const go = (p, prm) => { setPage(p); setParams(prm || {}); setMobileOpen(false); if (mainRef.current) mainRef.current.scrollTop = 0; };
  const setOnline = v => {
    if (!v) { setOnlineState(false); toast({ title: 'You’re offline', desc: 'Keep selling. Sales are saved on this device.', kind: 'warning' }); return; }
    const n = queued; setSyncing(true);
    setTimeout(() => { setDb(d => ({ ...d, sales: d.sales.map(s => s.pending ? { ...s, pending: false } : s), requests: d.requests.map(r => r.pendingSync ? { ...r, pendingSync: false } : r) }));
      setOnlineState(true); setSyncing(false); setLastSync(Date.now()); toast({ title: 'Back online', desc: n ? n + (n === 1 ? ' change' : ' changes') + ' synced to the cloud.' : 'Everything is up to date.' }); }, 1400);
  };
  const addToCart = p => {
    const e = sIdx[p.sku + '|' + branch]; const max = e ? e.qty : 0;
    const inCart = (pos.cart.find(l => l.sku === p.sku) || { qty: 0 }).qty;
    if (inCart >= max) { toast({ title: max ? 'Only ' + max + ' of ' + prodName(p) + ' in stock' : prodName(p) + ' is out of stock', kind: 'warning' }); return; }
    setPos(s => ({ ...s, cart: s.cart.some(l => l.sku === p.sku) ? s.cart.map(l => l.sku === p.sku ? { ...l, qty: l.qty + 1 } : l) : [...s.cart, { sku: p.sku, qty: 1, price: p.price, taxable: p.taxable !== false }] }));
  };
  const clearCart = () => setPos(s => ({ ...s, cart: [], cash: '', ref: '', discountId: 'none' }));
  const completeSale = (t, discount) => {
    const payment = { cash: 'Cash', gcash: 'GCash' }[pos.pay];
    const tendered = pos.pay === 'cash' ? parseFloat(pos.cash) || 0 : t.total;
    const sale = { or: (db.prefs.orPrefix || 'OR') + '-' + db.nextOr, ts: localTs(), branch, cashier: user.name, lines: pos.cart.map(l => ({ ...l })), items: t.itemCount,
      discount: t.discount, discLabel: discount && t.discount > 0 ? discount.name + ' ' + discShort(discount) : '', subtotal: t.subtotal, tax: t.tax, vatable: t.vatable, nonVat: t.nonVat, vatExempt: t.exempt, vatExemptAmt: t.vatExemptAmt,
      payment, amount: t.total, tendered, change: +(tendered - t.total).toFixed(2), ref: pos.pay === 'gcash' ? pos.ref.replace(/\s/g, '') : '', pending: !online };
    setDb(d => { const batches = d.batches.map(b => ({ ...b })); sale.lines.forEach(l => consumeFifo(batches, l.sku, branch, l.qty)); return { ...d, batches, sales: [sale, ...d.sales], nextOr: d.nextOr + 1 }; });
    setPos(s => ({ ...s, cart: [], cash: '', ref: '', discountId: 'none' }));
    toast({ title: 'Sale ' + sale.or + ' completed', desc: online ? peso(sale.amount) + ' · synced' : 'Saved offline · syncs when you reconnect', kind: online ? 'success' : 'warning' });
    return sale;
  };
  const login = a => { setUser(a); setBranch(a.branch); setPage(a.role === 'admin' ? 'dashboard' : 'pos'); setParams({}); };
  const logout = () => { setUser(null); clearCart(); setCmdOpen(false); };

  const ctx = { db, setDb, user, page, params, go, branch, setBranch: v => { setBranch(v); setPos(s => ({ ...s, cart: [] })); }, theme, setTheme, collapsed, setCollapsed, mobileOpen, setMobileOpen,
    online, setOnline, syncing, lastSync, queued, cmdOpen, setCmdOpen, toast, sIdx, low, pos, setPos, addToCart, clearCart, completeSale, logout };

  if (!user) return html`<${AppCtx.Provider} value=${ctx}><${Login} onLogin=${login} accounts=${db.accounts} /><${Toasts} list=${toasts} dismiss=${id => setToasts(l => l.filter(x => x.id !== id))} /><//>`;
  const allowed = user.role === 'admin' ? PAGE_TITLES : { pos: 1, inventory: 1, requests: 1 };
  const cur = allowed[page] ? page : 'pos';
  const Screen = { dashboard: Dashboard, activity: Activity, pos: POS, inventory: Inventory, requests: Requests, settings: Settings }[cur];
  return html`<${AppCtx.Provider} value=${{ ...ctx, page: cur }}>
    <div className="shell">
      <${Sidebar} />
      <div className="inset">
        <${Topbar} />
        ${!online && html`<div className="offline-banner" role="status"><${Icon} name="cloud-off" /><span><b>You’re offline.</b> Sales, stock and requests are saved on this device${queued ? ' (' + queued + ' queued)' : ''} and sync automatically when you reconnect.</span></div>`}
        <main className="main" ref=${mainRef} style=${cur === 'pos' ? { overflow: 'hidden auto' } : null}><${Screen} key=${cur} /></main>
      </div>
    </div>
    <${CommandPalette} />
    <${Toasts} list=${toasts} dismiss=${id => setToasts(l => l.filter(x => x.id !== id))} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);


</script>
