# Windows counter installer. Built on Windows (CI job "desktop installer").
appId: ph.stewardpharmacy.pos
productName: Steward Pharmacy
artifactName: steward-pharmacy-setup-${version}.${ext}
# argon2's native binding is a platform package; package.json lists the Windows
# (and macOS, for local testing) ones as optionalDependencies so they are bundled.
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!dist/**/*.map"
extraResources:
  # The same static web build Caddy serves, and the database migrations.
  - from: ../web/out
    to: web
  - from: ../../packages/db/drizzle
    to: migrations
asarUnpack:
  - node_modules/@electric-sql/pglite/**
  - node_modules/@node-rs/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
# A short guided install: Welcome -> progress -> Finish. Branding (icon, sidebar, header) and
# wording live in build/ (installer.nsh, scripts/installer-art.mjs).
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Steward Pharmacy
  uninstallDisplayName: Steward Pharmacy
  runAfterFinish: true
  # The counter's local database (sales, stock, outbox) survives an uninstall or reinstall.
  deleteAppDataOnUninstall: false
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
publish:
  # The update feed lives on the Steward server (see docs/deploy.md).
  provider: generic
  url: ${env.STEWARD_UPDATE_URL}
