name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Database tests run on PGlite and, with this set, on real PostgreSQL too.
      TEST_DATABASE_URL: postgres://steward:steward@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @steward/web exec playwright install --with-deps chromium

      - name: End-to-end tests (UI on demo data)
        run: pnpm test:e2e

      - name: End-to-end tests (full stack, real API)
        run: pnpm --filter @steward/web test:e2e:fullstack

      - name: Build the desktop app
        run: pnpm --filter @steward/desktop build

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (desktop app)
        run: xvfb-run --auto-servernum pnpm --filter @steward/desktop test:e2e:desktop

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  desktop-installer:
    name: Desktop installer (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_DEPLOY_ENV: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @steward/web build

      - name: Build the NSIS installer (unsigned)
        run: pnpm --filter @steward/desktop package --win --publish never
        env:
          STEWARD_UPDATE_URL: https://updates.invalid/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: apps/desktop/release/*.exe
          retention-days: 14
